version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Compiler-owned pins must move through `gh aw compile`, not a direct
      # Dependabot edit of generated lock workflows.
      - dependency-name: "github/gh-aw-actions/*"
