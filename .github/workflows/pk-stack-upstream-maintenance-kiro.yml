name: PKStack Upstream Maintenance (Kiro)

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      retry_source:
        description: 'Explicit retry after three rejections: source-id@current-subtree-sha'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: pkstack-upstream-maintenance-${{ github.repository }}
  cancel-in-progress: false

env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      default_branch: ${{ steps.plan.outputs.default_branch }}
      should_run: ${{ steps.plan.outputs.should_run }}
    steps:
      - name: Harden runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            github.com:443
      - name: Check out immutable workflow controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve trusted base and open-PR guard
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ github.sha }}
        with:
          script: |
            const { classifyOpenCandidate } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pkstack_pr_policy.js`
            );
            const { owner, repo } = context.repo;
            const repository = (await github.rest.repos.get({ owner, repo })).data;
            const defaultBranch = repository.default_branch;
            if (context.ref !== `refs/heads/${defaultBranch}`) {
              core.setFailed(`maintenance must run from default branch ${defaultBranch}`);
              return;
            }
            const policyResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/pkstack-maintenance-policy.json",
              ref: process.env.BASE_SHA,
            });
            if (Array.isArray(policyResponse.data) || policyResponse.data.type !== "file") {
              core.setFailed("maintenance policy is not a file");
              return;
            }
            const policy = JSON.parse(Buffer.from(policyResponse.data.content, "base64").toString("utf8"));
            const configured = policy.source_workflows.find((item) => item.provider === "kiro");
            if (!configured || configured.name !== context.workflow) {
              core.setFailed("Kiro source workflow does not match immutable policy");
              return;
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: defaultBranch,
              per_page: 100,
            });
            let decision;
            try {
              decision = await classifyOpenCandidate({
                pulls,
                policy,
                baseSha: process.env.BASE_SHA,
                defaultBranch,
                repositoryFullName: `${owner}/${repo}`,
                loadCommit: async (sha) => (await github.rest.git.getCommit({
                  owner, repo, commit_sha: sha,
                })).data,
                loadSourceRun: async (runId) => (await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: runId,
                })).data,
                loadCandidateRuns: async () => github.paginate(
                  github.rest.actions.listWorkflowRuns,
                  {
                    owner,
                    repo,
                    workflow_id: policy.candidate_lifecycle.workflow_path,
                    event: "workflow_run",
                    per_page: 100,
                  },
                ),
                nowMs: Date.now(),
              });
            } catch (error) {
              core.setFailed(error.message);
              return;
            }
            if (decision.action === "skip") {
              core.info(
                `exact candidate run ${decision.candidateRunId} is ${decision.candidateRunStatus} `
                + `and ${decision.ageSeconds}s old for PR #${decision.prNumber}; skipping Kiro credits`
              );
              core.setOutput("should_run", "false");
            } else {
              core.setOutput("should_run", "true");
            }
            core.setOutput("base_sha", process.env.BASE_SHA);
            core.setOutput("default_branch", defaultBranch);

  detect:
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      needs_maintenance: ${{ steps.detect.outputs.needs_maintenance }}
      detector_sha256: ${{ steps.detect.outputs.detector_sha256 }}
      control_plan_sha256: ${{ steps.detect.outputs.control_plan_sha256 }}
      control_action: ${{ steps.detect.outputs.control_action }}
      selected_source_id: ${{ steps.detect.outputs.selected_source_id }}
      retrieved_on: ${{ steps.detect.outputs.retrieved_on }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Harden runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Snapshot immutable sensor and controller
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          TRUSTED_ROOT: ${{ runner.temp }}/pkstack-trusted
        run: |
          set -euo pipefail
          mkdir -p "$TRUSTED_ROOT"
          git archive "$BASE_SHA" \
            .pkstack/projectctl \
            .github/pkstack-maintenance-policy.json \
            .github/scripts/pkstack_maintenance_guard.py \
            .github/scripts/pkstack_update_controller.py \
            .github/scripts/pkstack_review_feedback.py \
            .github/scripts/pkstack_verification_feedback.py \
            | tar -x -C "$TRUSTED_ROOT"
          UV_PROJECT_ENVIRONMENT="$TRUSTED_ROOT/.pkstack/projectctl/.venv" \
            uv sync --quiet --locked --no-config \
            --project "$TRUSTED_ROOT/.pkstack/projectctl"
      - name: Re-prove pinned upstream identity and drift
        id: detect
        env:
          TRUSTED_ROOT: ${{ runner.temp }}/pkstack-trusted
          EVIDENCE_ROOT: ${{ runner.temp }}/pkstack-loop-evidence
          READONLY_GITHUB_TOKEN: ${{ github.token }}
          RETRY_SOURCE: ${{ github.event.inputs.retry_source || '' }}
        run: |
          set -euo pipefail
          trusted_projectctl="$TRUSTED_ROOT/.pkstack/projectctl"
          mkdir -p "$EVIDENCE_ROOT"
          detector_path="$EVIDENCE_ROOT/upstream-check.json"
          control_plan_path="$EVIDENCE_ROOT/control-plan.json"
          retrieved_on=$(date -u +%F)
          set +e
          GITHUB_TOKEN="$READONLY_GITHUB_TOKEN" \
            PYTHONPATH="$trusted_projectctl/src" \
            "$trusted_projectctl/.venv/bin/python" -B -X pycache_prefix=/dev/null \
            -m pkstack upstream check \
            --manifest maintenance/upstreams.json \
            --power-root powers/pkstack \
            --output json >"$detector_path"
          detector_rc=$?
          set -e
          python3 "$TRUSTED_ROOT/.github/scripts/pkstack_maintenance_guard.py" \
            validate-detector --detector "$detector_path"
          if [[ "$(date -u +%F)" != "$retrieved_on" ]]; then
            echo "upstream inventory retrieval crossed a UTC date boundary" >&2
            exit 1
          fi
          python3 "$TRUSTED_ROOT/.github/scripts/pkstack_update_controller.py" \
            --detector "$detector_path" \
            --feedback maintenance/upstream-feedback.json \
            --retry-source "$RETRY_SOURCE" \
            --output "$control_plan_path"
          needs_maintenance=$(python3 - "$detector_path" "$detector_rc" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          rc = int(sys.argv[2])
          if payload.get("ok") is True:
              if rc != 0:
                  raise SystemExit("zero-drift detector returned nonzero")
              print("false")
          else:
              if rc == 0:
                  raise SystemExit("drift detector returned zero")
              print("true")
          PY
          )
          detector_sha256=$(sha256sum "$detector_path" | cut -d' ' -f1)
          control_plan_sha256=$(sha256sum "$control_plan_path" | cut -d' ' -f1)
          control_action=$(jq -er '.action' "$control_plan_path")
          if [[ "$control_action" != "reconcile-source" ]]; then
            needs_maintenance=false
          fi
          selected_source_id=$(jq -er '.selected_source_id // ""' "$control_plan_path")
          {
            printf 'needs_maintenance=%s\n' "$needs_maintenance"
            printf 'detector_sha256=%s\n' "$detector_sha256"
            printf 'control_plan_sha256=%s\n' "$control_plan_sha256"
            printf 'control_action=%s\n' "$control_action"
            printf 'selected_source_id=%s\n' "$selected_source_id"
            printf 'retrieved_on=%s\n' "$retrieved_on"
          } >>"$GITHUB_OUTPUT"
      - name: Upload bounded detector evidence
        id: upload
        if: steps.detect.outputs.needs_maintenance == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-detector-${{ github.run_id }}
          path: ${{ runner.temp }}/pkstack-loop-evidence
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  # This high-risk scheduled lane deliberately uses experimental Sol/max. Each
  # credential-bearing repair invocation revalidates the live model inventory
  # before a model turn and fails closed rather than substituting another model.
  maintain:
    needs: [plan, detect]
    if: needs.detect.outputs.needs_maintenance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    outputs:
      has_changes: ${{ steps.package.outputs.has_changes }}
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      PKSTACK_UPSTREAM_RETRIEVED_ON: ${{ needs.detect.outputs.retrieved_on }}
    steps:
      - name: Harden runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            app.kiro.dev:443
            assets.app.kiro.dev:443
            cli.kiro.dev:443
            desktop-release.q.us-east-1.amazonaws.com:443
            files.pythonhosted.org:443
            github.com:443
            management.eu-central-1.kiro.dev:443
            management.us-east-1.kiro.dev:443
            objects.githubusercontent.com:443
            prod.download.cli.kiro.dev:443
            prod.download.desktop.kiro.dev:443
            prod.us-east-1.auth.desktop.kiro.dev:443
            prod.us-east-1.telemetry.desktop.kiro.dev:443
            pypi.org:443
            q.eu-central-1.amazonaws.com:443
            q.us-east-1.amazonaws.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            runtime.eu-central-1.kiro.dev:443
            runtime.us-east-1.kiro.dev:443
            telemetry.eu-central-1.kiro.dev:443
            telemetry.us-east-1.kiro.dev:443
            *.blob.core.windows.net:443
      - name: Bind ephemeral maintenance paths
        run: |
          set -euo pipefail
          {
            printf 'TRUSTED_ROOT=%s\n' "$RUNNER_TEMP/pkstack-trusted"
            printf 'TRUSTED_PROJECTCTL_ROOT=%s\n' "$RUNNER_TEMP/pkstack-trusted/.pkstack/projectctl"
            printf 'GUARD_PATH=%s\n' "$RUNNER_TEMP/pkstack-trusted/.github/scripts/pkstack_maintenance_guard.py"
            printf 'VERIFY_PATH=%s\n' "$RUNNER_TEMP/pkstack-trusted/.github/scripts/verify_pkstack_attempt.sh"
            printf 'KIRO_RUNNER_PATH=%s\n' "$RUNNER_TEMP/pkstack-trusted/.github/scripts/run_kiro_maintenance_attempt.sh"
            printf 'KIRO_SETUP_PATH=%s\n' "$RUNNER_TEMP/pkstack-trusted/.github/scripts/prepare_kiro_maintenance_runtime.sh"
            printf 'DETECTOR_PATH=%s\n' "$RUNNER_TEMP/pkstack-detector/upstream-check.json"
            printf 'CONTROL_PLAN_PATH=%s\n' "$RUNNER_TEMP/pkstack-detector/control-plan.json"
            printf 'FEEDBACK_PATH=%s\n' "$RUNNER_TEMP/pkstack-verification-feedback.txt"
            printf 'GOAL_STATUS_PATH=%s\n' "$RUNNER_TEMP/pkstack-goal-status.json"
            printf 'KIRO_BIN_DIR=%s\n' "$RUNNER_TEMP/kiro-bin"
            printf 'KIRO_ARCHIVE=%s\n' "$RUNNER_TEMP/kiro-cache/kirocli-2.21.1.tar.xz"
            printf 'KIRO_HOME=%s\n' "$RUNNER_TEMP/kiro-user-home/.kiro"
            printf 'KIRO_USER_HOME=%s\n' "$RUNNER_TEMP/kiro-user-home"
            printf 'GIT_BOUNDARY_STATE=%s\n' "$RUNNER_TEMP/pkstack-git-boundary-state"
          } >>"$GITHUB_ENV"
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download detector evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.detect.outputs.artifact_id }}
          path: ${{ runner.temp }}/pkstack-detector
      - name: Verify detector artifact identity
        env:
          EXPECTED_SHA256: ${{ needs.detect.outputs.detector_sha256 }}
          EXPECTED_CONTROL_SHA256: ${{ needs.detect.outputs.control_plan_sha256 }}
          EXPECTED_CONTROL_ACTION: ${{ needs.detect.outputs.control_action }}
          EXPECTED_SOURCE_ID: ${{ needs.detect.outputs.selected_source_id }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_SHA256" "$DETECTOR_PATH" | sha256sum --check
          printf '%s  %s\n' "$EXPECTED_CONTROL_SHA256" "$CONTROL_PLAN_PATH" | sha256sum --check
          test "$(jq -er '.sensor_sha256' "$CONTROL_PLAN_PATH")" = "$EXPECTED_SHA256"
          test "$(jq -er '.action' "$CONTROL_PLAN_PATH")" = "$EXPECTED_CONTROL_ACTION"
          test "$(jq -er '.selected_source_id // ""' "$CONTROL_PLAN_PATH")" = "$EXPECTED_SOURCE_ID"
      - name: Install uv and materialize protected lockfiles
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Materialize locked environments and trusted scripts
        run: |
          set -euo pipefail
          mkdir -p "$TRUSTED_ROOT"
          git archive "$BASE_SHA" \
            Wiki/features/pkstack-upstream-maintenance.md \
            .pkstack/projectctl \
            .github/agent-memory/pkstack-upstream.md \
            .github/fixtures \
            .github/pkstack-maintenance-policy.json \
            .github/scripts \
            .github/workflows \
            .kiro/agents \
            | tar -x -C "$TRUSTED_ROOT"
          uv sync --quiet --locked --all-groups --project powers/pkstack
          UV_PROJECT_ENVIRONMENT="$TRUSTED_PROJECTCTL_ROOT/.venv" \
            uv sync --quiet --locked --no-config --project "$TRUSTED_PROJECTCTL_ROOT"
          python3 "$GUARD_PATH" validate-detector --detector "$DETECTOR_PATH"
          python3 "$GUARD_PATH" validate-ci-agent \
            --agent .kiro/agents/pkstack-maintainer.json
          python3 "$GUARD_PATH" validate-trusted-snapshot \
            --base "$BASE_SHA" \
            --trusted-root "$TRUSTED_ROOT"
          python3 -B "$TRUSTED_ROOT/.github/scripts/test_validate_kiro_model_inventory.py"
          python3 -B "$TRUSTED_ROOT/.github/scripts/test_validate_kiro_maintenance_stream.py"
          python3 "$GUARD_PATH" validate-trusted-snapshot \
            --base "$BASE_SHA" \
            --trusted-root "$TRUSTED_ROOT"
          chmod -R a-w "$TRUSTED_ROOT"
      - name: Restore pinned Kiro CLI archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kiro-cache/kirocli-2.21.1.tar.xz
          key: kiro-cli-linux-x86-64-2.21.1-7fc0564fd02295a64470c4bf52752f5475f3280be3fa4dd9db255162e07e9825
      - name: Verify checksum-pinned Kiro CLI 2.21.1 archive
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KIRO_ARCHIVE")"
          if [[ ! -f "$KIRO_ARCHIVE" ]]; then
            curl --proto '=https' --tlsv1.2 --fail --location \
              --retry 3 --retry-all-errors --output "$KIRO_ARCHIVE" \
              https://prod.download.cli.kiro.dev/stable/2.21.1/kirocli-x86_64-linux.tar.xz
          fi
          printf '%s  %s\n' \
            7fc0564fd02295a64470c4bf52752f5475f3280be3fa4dd9db255162e07e9825 \
            "$KIRO_ARCHIVE" | sha256sum --check
      - name: Start immutable goal and record the required pre-edit failure
        env:
          READONLY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_projectctl() {
            PYTHONPATH="$TRUSTED_PROJECTCTL_ROOT/src" \
              "$TRUSTED_PROJECTCTL_ROOT/.venv/bin/python" -B -X pycache_prefix=/dev/null \
              -m pkstack "$@"
          }
          python3 "$GUARD_PATH" validate-detector --detector "$DETECTOR_PATH" >/dev/null
          action=$(jq -er '.action' "$CONTROL_PLAN_PATH")
          objective=$(jq -er '.objective' "$CONTROL_PLAN_PATH")
          goal_kind=$(jq -er '.goal.kind' "$CONTROL_PLAN_PATH")
          goal_value=$(jq -er '.goal.value' "$CONTROL_PLAN_PATH")
          max_attempts=$(jq -er '.max_attempts' "$CONTROL_PLAN_PATH")
          test "$action" = "reconcile-source"
          test "$max_attempts" = "5"
          test "$(jq -er '.max_open_candidates' "$CONTROL_PLAN_PATH")" = "1"
          test "$goal_kind" = "command"
          trusted_projectctl goal start \
            "$objective" \
            --command "$goal_value" \
            --max-attempts "$max_attempts" \
            --output json >"$RUNNER_TEMP/pkstack-goal-start.json"
          set +e
          GITHUB_TOKEN="$READONLY_GITHUB_TOKEN" \
            trusted_projectctl goal verify --output json \
            >"$RUNNER_TEMP/pkstack-goal-initial-verify.json" 2>&1
          initial_rc=$?
          set -e
          test "$initial_rc" -ne 0
          trusted_projectctl goal status --output json \
            | jq -e '.ok == true and .goal.status == "active" and .goal.attempt_count == 1 and .goal.max_attempts == 5'
          printf '%s\n' \
            "The immutable pre-edit goal verification failed as required because upstream, source parity, or generated parity still drifts." \
            >"$FEEDBACK_PATH"

      - name: Prepare repair 1 without workspace hooks
        run: |
          python3 "$GUARD_PATH" prepare-attempt \
            --base "$BASE_SHA" \
            --detector "$DETECTOR_PATH" \
            --feedback "$FEEDBACK_PATH" \
            --control-plan "$CONTROL_PLAN_PATH" \
            --memory "$TRUSTED_ROOT/.github/agent-memory/pkstack-upstream.md" \
            --git-state "$GIT_BOUNDARY_STATE"
          bash "$KIRO_SETUP_PATH"
      - name: Kiro repair 1 of 4
        env:
          ATTEMPT_NUMBER: "1"
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: bash "$KIRO_RUNNER_PATH"
      - name: Secretless verification 1 of 4
        id: verify1
        env:
          ATTEMPT_NUMBER: "1"
          READONLY_GITHUB_TOKEN: ${{ github.token }}
        run: bash "$VERIFY_PATH"

      - name: Prepare repair 2 without workspace hooks
        if: steps.verify1.outputs.passed != 'true'
        run: |
          python3 "$GUARD_PATH" prepare-attempt \
            --base "$BASE_SHA" \
            --detector "$DETECTOR_PATH" \
            --feedback "$FEEDBACK_PATH" \
            --control-plan "$CONTROL_PLAN_PATH" \
            --memory "$TRUSTED_ROOT/.github/agent-memory/pkstack-upstream.md" \
            --git-state "$GIT_BOUNDARY_STATE"
          bash "$KIRO_SETUP_PATH"
      - name: Kiro repair 2 of 4
        if: steps.verify1.outputs.passed != 'true'
        env:
          ATTEMPT_NUMBER: "2"
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: bash "$KIRO_RUNNER_PATH"
      - name: Secretless verification 2 of 4
        id: verify2
        if: steps.verify1.outputs.passed != 'true'
        env:
          ATTEMPT_NUMBER: "2"
          READONLY_GITHUB_TOKEN: ${{ github.token }}
        run: bash "$VERIFY_PATH"

      - name: Prepare repair 3 without workspace hooks
        if: steps.verify1.outputs.passed != 'true' && steps.verify2.outputs.passed != 'true'
        run: |
          python3 "$GUARD_PATH" prepare-attempt \
            --base "$BASE_SHA" \
            --detector "$DETECTOR_PATH" \
            --feedback "$FEEDBACK_PATH" \
            --control-plan "$CONTROL_PLAN_PATH" \
            --memory "$TRUSTED_ROOT/.github/agent-memory/pkstack-upstream.md" \
            --git-state "$GIT_BOUNDARY_STATE"
          bash "$KIRO_SETUP_PATH"
      - name: Kiro repair 3 of 4
        if: steps.verify1.outputs.passed != 'true' && steps.verify2.outputs.passed != 'true'
        env:
          ATTEMPT_NUMBER: "3"
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: bash "$KIRO_RUNNER_PATH"
      - name: Secretless verification 3 of 4
        id: verify3
        if: steps.verify1.outputs.passed != 'true' && steps.verify2.outputs.passed != 'true'
        env:
          ATTEMPT_NUMBER: "3"
          READONLY_GITHUB_TOKEN: ${{ github.token }}
        run: bash "$VERIFY_PATH"

      - name: Prepare repair 4 without workspace hooks
        if: steps.verify1.outputs.passed != 'true' && steps.verify2.outputs.passed != 'true' && steps.verify3.outputs.passed != 'true'
        run: |
          python3 "$GUARD_PATH" prepare-attempt \
            --base "$BASE_SHA" \
            --detector "$DETECTOR_PATH" \
            --feedback "$FEEDBACK_PATH" \
            --control-plan "$CONTROL_PLAN_PATH" \
            --memory "$TRUSTED_ROOT/.github/agent-memory/pkstack-upstream.md" \
            --git-state "$GIT_BOUNDARY_STATE"
          bash "$KIRO_SETUP_PATH"
      - name: Kiro repair 4 of 4
        if: steps.verify1.outputs.passed != 'true' && steps.verify2.outputs.passed != 'true' && steps.verify3.outputs.passed != 'true'
        env:
          ATTEMPT_NUMBER: "4"
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: bash "$KIRO_RUNNER_PATH"
      - name: Secretless verification 4 of 4
        id: verify4
        if: steps.verify1.outputs.passed != 'true' && steps.verify2.outputs.passed != 'true' && steps.verify3.outputs.passed != 'true'
        env:
          ATTEMPT_NUMBER: "4"
          READONLY_GITHUB_TOKEN: ${{ github.token }}
        run: bash "$VERIFY_PATH"

      - name: Require a terminal verified candidate
        env:
          PASS1: ${{ steps.verify1.outputs.passed }}
          PASS2: ${{ steps.verify2.outputs.passed }}
          PASS3: ${{ steps.verify3.outputs.passed }}
          PASS4: ${{ steps.verify4.outputs.passed }}
        run: |
          set -euo pipefail
          [[ "$PASS1" == "true" || "$PASS2" == "true" || "$PASS3" == "true" || "$PASS4" == "true" ]]
      - name: Package the immutable candidate
        id: package
        env:
          SOURCE_WORKFLOW: PKStack Upstream Maintenance (Kiro)
          SOURCE_RUN_ID: ${{ github.run_id }}
          PACKAGE_PATH: ${{ runner.temp }}/pkstack-candidate.json
        run: |
          set -euo pipefail
          umask 077
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_SYSTEM=/dev/null
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_ATTR_NOSYSTEM=1
          export GIT_EXTERNAL_DIFF=
          export GIT_NO_REPLACE_OBJECTS=1
          export GIT_PAGER=cat
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=4
          export GIT_CONFIG_KEY_0=core.hooksPath
          export GIT_CONFIG_VALUE_0=/dev/null
          export GIT_CONFIG_KEY_1=core.fsmonitor
          export GIT_CONFIG_VALUE_1=false
          export GIT_CONFIG_KEY_2=diff.external
          export GIT_CONFIG_VALUE_2=
          export GIT_CONFIG_KEY_3=core.attributesFile
          export GIT_CONFIG_VALUE_3=/dev/null
          export GIT_DIR="$GIT_BOUNDARY_STATE/git"
          export GIT_COMMON_DIR="$GIT_BOUNDARY_STATE/git"
          export GIT_WORK_TREE="$GITHUB_WORKSPACE"
          export GIT_INDEX_FILE="$GIT_BOUNDARY_STATE/index"
          export GIT_OBJECT_DIRECTORY="$GIT_BOUNDARY_STATE/objects"
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/.git/objects"
          python3 "$GUARD_PATH" --github-output "$GITHUB_OUTPUT" package \
            --base "$BASE_SHA" \
            --detector "$DETECTOR_PATH" \
            --goal-status "$GOAL_STATUS_PATH" \
            --output "$PACKAGE_PATH" \
            --source-workflow "$SOURCE_WORKFLOW" \
            --source-run-id "$SOURCE_RUN_ID" \
            --provider kiro
      - name: Close the trusted Git finalizer boundary
        if: >-
          ${{ always() &&
              (steps.verify1.outputs.passed == 'true' ||
               steps.verify2.outputs.passed == 'true' ||
               steps.verify3.outputs.passed == 'true' ||
               steps.verify4.outputs.passed == 'true') }}
        run: |
          set -euo pipefail
          python3 "$GUARD_PATH" finalize-git-state \
            --base "$BASE_SHA" \
            --git-state "$GIT_BOUNDARY_STATE"
      - name: Upload verified candidate package
        id: upload
        if: steps.package.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/pkstack-candidate.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  publish:
    needs: [plan, detect, maintain]
    if: needs.maintain.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download candidate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.maintain.outputs.artifact_id }}
          path: ${{ runner.temp }}/pkstack-candidate
      - name: Reconstruct and validate candidate without executing it
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          EXPECTED_DIGEST: ${{ needs.maintain.outputs.package_sha256 }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/pkstack_maintenance_guard.py validate-package \
            --base "$BASE_SHA" \
            --package "$RUNNER_TEMP/pkstack-candidate/pkstack-candidate.json" \
            --expected-digest "$EXPECTED_DIGEST" \
            --source-workflow 'PKStack Upstream Maintenance (Kiro)' \
            --source-run-id "$SOURCE_RUN_ID" \
            --provider kiro
      - name: Create one exact candidate commit and non-draft PR through the API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ needs.plan.outputs.default_branch }}
          PACKAGE_PATH: ${{ runner.temp }}/pkstack-candidate/pkstack-candidate.json
          PACKAGE_SHA256: ${{ needs.maintain.outputs.package_sha256 }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const candidate = JSON.parse(fs.readFileSync(process.env.PACKAGE_PATH, "utf8"));
            const policyRaw = fs.readFileSync(".github/pkstack-maintenance-policy.json", "utf8");
            const policy = JSON.parse(policyRaw);
            const repository = (await github.rest.repos.get({ owner, repo })).data;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: process.env.DEFAULT_BRANCH });
            if (repository.default_branch !== process.env.DEFAULT_BRANCH || branch.data.commit.sha !== process.env.BASE_SHA) {
              core.setFailed("default branch moved during maintenance; refusing stale PR");
              return;
            }
            const baseCommit = (await github.rest.git.getCommit({ owner, repo, commit_sha: process.env.BASE_SHA })).data;
            const treeEntries = [];
            for (const file of candidate.files) {
              if (file.deleted) {
                treeEntries.push({ path: file.path, mode: "100644", type: "blob", sha: null });
                continue;
              }
              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content: file.content_base64,
                encoding: "base64",
              });
              treeEntries.push({ path: file.path, mode: file.mode, type: "blob", sha: blob.data.sha });
            }
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseCommit.tree.sha,
              tree: treeEntries,
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: policy.pull_request.title,
              tree: tree.data.sha,
              parents: [process.env.BASE_SHA],
            });
            const branchName = `${policy.pull_request.branch_prefix}kiro-${context.runId}`;
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branchName}`,
              sha: commit.data.sha,
            });
            const upstreams = candidate.upstreams.map((item) =>
              `- ${item.repository}/${item.path}: \`${item.previous_commit}\` -> \`${item.current_commit}\``
            ).join("\n");
            const body = [
              "Automated PKStack semantic reconciliation by checksum-pinned Kiro CLI 2.21.1 / GPT-5.6 Sol with --effort max requested (Kiro stream metadata does not independently attest effort).",
              "",
              "Upstream identities:",
              upstreams,
              "",
              `Verified goal: \`${candidate.goal.goal_id}\` passed at attempt ${candidate.goal.attempt_count}/${candidate.goal.max_attempts}.`,
              `Deterministic gates: immutable upstream re-proof, feature validation/verification, generated parity, root and Power lint/type/test suites.`,
              `Candidate package SHA-256: \`${process.env.PACKAGE_SHA256}\`.`,
              "",
              `Source run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const pull = await github.rest.pulls.create({
              owner,
              repo,
              title: policy.pull_request.title,
              head: branchName,
              base: process.env.DEFAULT_BRANCH,
              body,
              draft: false,
            });
            core.notice(`created maintenance PR #${pull.data.number} at ${commit.data.sha}`);
