          CI_AGENT_BASE64: |-
            ewogICJuYW1lIjogInBrLXN0YWNrLWNyZWRlbnRpYWwtc21va2UiLAogICJkZXNjcmlwdGlvbiI6ICJJbW11dGFibGUgQ0ktb25s
            eSB0b29sLWZyZWUgUEstU3RhY2sgS2lybyBjcmVkZW50aWFsIHNtb2tlLiIsCiAgInByb21wdCI6ICJUaGlzIGlzIGFuIGF1dGhl
            bnRpY2F0aW9uLW9ubHkgc21va2UuIFlvdSBoYXZlIG5vIHRvb2xzIG9yIHJlc291cmNlcy4gUmVwbHkgZXhhY3RseSBQSy1TVEFD
            Sy1LSVJPLUFVVEgtT0sgYW5kIGRvIG5vdGhpbmcgZWxzZS4iLAogICJ0b29scyI6IFtdLAogICJpbmNsdWRlTWNwSnNvbiI6IGZh
            bHNlLAogICJpbmNsdWRlUG93ZXJzIjogZmFsc2UsCiAgInJlc291cmNlcyI6IFtdLAogICJwZXJtaXNzaW9ucyI6IHsKICAgICJy
            dWxlcyI6IFtdCiAgfSwKICAidG9vbHNTZXR0aW5ncyI6IHt9LAogICJ3ZWxjb21lTWVzc2FnZSI6ICJUb29sLWZyZWUgY3JlZGVu
            dGlhbCBzbW9rZSBmaXh0dXJlIGxvYWRlZC4iCn0K
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$SMOKE_ROOT"
          mkdir -p \
            "$SMOKE_ROOT/bin" \
            "$SMOKE_ROOT/kiro-home/agents" \
            "$SMOKE_ROOT/user-home" \
            "$SMOKE_ROOT/runtime" \
            "$SMOKE_ROOT/workspace"
          archive="$SMOKE_ROOT/kirocli-2.21.0.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$archive" \
            https://prod.download.cli.kiro.dev/stable/2.21.0/kirocli-x86_64-linux.tar.xz
          printf '%s  %s\n' \
            6eccb46617a84690fc892219f264f7617312761c9a3d7e38cc47a0e2ab0152b7 \
            "$archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$SMOKE_ROOT/bin" \
            --strip-components=2 \
            kirocli/bin/kiro-cli \
            kirocli/bin/kiro-cli-chat
          test "$("$SMOKE_ROOT/bin/kiro-cli" --version)" = "kiro-cli 2.21.0"
          printf '%s' "$CI_AGENT_BASE64" | base64 --decode \
            >"$SMOKE_ROOT/kiro-home/agents/pk-stack-credential-smoke.json"
          printf '%s  %s\n' "$CI_AGENT_SHA256" \
            "$SMOKE_ROOT/kiro-home/agents/pk-stack-credential-smoke.json" \
            | sha256sum --check
          printf '%s' "$STREAM_VALIDATOR_BASE64" | base64 --decode \
            >"$SMOKE_ROOT/validate-stream.py"
          printf '%s  %s\n' "$STREAM_VALIDATOR_SHA256" \
            "$SMOKE_ROOT/validate-stream.py" | sha256sum --check
          printf '%s\n' 'PK-Stack credential smoke mutation sentinel.' \
            >"$SMOKE_ROOT/workspace/sentinel.txt"
          mkdir -m 0700 "$SMOKE_ROOT/kiro-home/settings"
          settings_path="$SMOKE_ROOT/kiro-home/settings/cli.json"
          install -m 0600 /dev/null "$settings_path"
          printf '%s\n' \
            '{' \
            '  "app.disableAutoupdates": true,' \
            '  "chat.disableInheritingDefaultResources": true,' \
            '  "telemetry.enabled": false' \
            '}' >"$settings_path"
          printf '%s  %s\n' \
            81d98ac813691c26f18f797ca5126c5150125cf74d2f6d413e152290074a6bd0 \
            "$settings_path" | sha256sum --check
          test "$(stat -c '%a' "$settings_path")" = 600
          test ! -e "$SMOKE_ROOT/kiro-home/settings/mcp.json"
          test ! -e "$SMOKE_ROOT/user-home/.kiro"
          find "$SMOKE_ROOT/workspace" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            >"$SMOKE_ROOT/workspace.sha256"
          chmod -R a-w "$SMOKE_ROOT/workspace"
      - name: Invoke one bounded no-tool Sol credential smoke
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          SMOKE_ROOT: ${{ runner.temp }}/pk-stack-kiro-credential-smoke
        run: |
          set -euo pipefail
          : "${KIRO_API_KEY:?KIRO_API_KEY is not configured}"
          (
            cd "$SMOKE_ROOT/workspace"
            env -i \
              HOME="$SMOKE_ROOT/user-home" \
              KIRO_HOME="$SMOKE_ROOT/kiro-home" \
              PATH="$SMOKE_ROOT/bin:/usr/local/bin:/usr/bin:/bin" \
              LANG=C.UTF-8 \
              CI=true \
              NO_COLOR=1 \
              KIRO_LOG_NO_COLOR=1 \
              XDG_RUNTIME_DIR="$SMOKE_ROOT/runtime" \
              SSL_CERT_DIR=/etc/ssl/certs \
              KIRO_API_KEY="$KIRO_API_KEY" \
              "$SMOKE_ROOT/bin/kiro-cli" agent validate \
                --path "$SMOKE_ROOT/kiro-home/agents/pk-stack-credential-smoke.json"
          )
          stream="$SMOKE_ROOT/stream.jsonl"
          stderr="$SMOKE_ROOT/stderr.log"
          prompt='Authentication smoke only. Invoke no tools and reply exactly PK-STACK-KIRO-AUTH-OK.'
          set +e
          (
            cd "$SMOKE_ROOT/workspace"
            env -i \
              HOME="$SMOKE_ROOT/user-home" \
              KIRO_HOME="$SMOKE_ROOT/kiro-home" \
              PATH="$SMOKE_ROOT/bin:/usr/local/bin:/usr/bin:/bin" \
              LANG=C.UTF-8 \
              CI=true \
              NO_COLOR=1 \
              KIRO_LOG_NO_COLOR=1 \
              XDG_RUNTIME_DIR="$SMOKE_ROOT/runtime" \
              SSL_CERT_DIR=/etc/ssl/certs \
              KIRO_API_KEY="$KIRO_API_KEY" \
              timeout --signal=TERM --kill-after=5s 120s \
              "$SMOKE_ROOT/bin/kiro-cli" chat \
                --v3 \
                --agent pk-stack-credential-smoke \
                --model gpt-5.6-sol \
                --effort max \
                --no-interactive \
                --trust-tools= \
                --output-format stream-json \
                "$prompt"
          ) >"$stream" 2>"$stderr"
          kiro_rc=$?
          set -e
          actual_workspace_sha256=$(
            find "$SMOKE_ROOT/workspace" -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum
          )
          expected_workspace_sha256=$(cat "$SMOKE_ROOT/workspace.sha256")
          test "$actual_workspace_sha256" = "$expected_workspace_sha256"
          test -z "$(find "$SMOKE_ROOT/workspace" -perm /222 -print -quit)"
          python3 "$SMOKE_ROOT/validate-stream.py" \
            --stream "$stream" \
            --stderr "$stderr" \
            --return-code "$kiro_rc"
          printf '%s\n' 'Kiro API credential authenticated through one no-tool Sol exchange with max requested.'
      - name: Remove every credential-smoke runtime and log
        if: always()
        env:
          SMOKE_ROOT: ${{ runner.temp }}/pk-stack-kiro-credential-smoke
        run: |
          set -euo pipefail
          case "$SMOKE_ROOT" in
            "$RUNNER_TEMP"/pk-stack-kiro-credential-smoke) ;;
            *) exit 1 ;;
          esac
          if [ -e "$SMOKE_ROOT" ] || [ -L "$SMOKE_ROOT" ]; then
            test -d "$SMOKE_ROOT"
            test ! -L "$SMOKE_ROOT"
            test -O "$SMOKE_ROOT"
            chmod -R u+rwX "$SMOKE_ROOT"
            rm -rf -- "$SMOKE_ROOT"
          fi
          test ! -e "$SMOKE_ROOT"
          test ! -L "$SMOKE_ROOT"
