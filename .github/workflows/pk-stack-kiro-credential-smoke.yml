            aWNhdGlvbi1vbmx5IHNtb2tlLiBZb3UgaGF2ZSBubyB0b29scyBvciByZXNvdXJjZXMuIFJlcGx5IGV4YWN0bHkgUEstU1RBQ0st
            S0lSTy1BVVRILU9LIGFuZCBkbyBub3RoaW5nIGVsc2UuIiwKICAidG9vbHMiOiBbXSwKICAiaW5jbHVkZU1jcEpzb24iOiBmYWxz
            ZSwKICAiaW5jbHVkZVBvd2VycyI6IGZhbHNlLAogICJyZXNvdXJjZXMiOiBbXSwKICAicGVybWlzc2lvbnMiOiB7CiAgICAicnVs
            ZXMiOiBbXQogIH0sCiAgInRvb2xzU2V0dGluZ3MiOiB7fSwKICAid2VsY29tZU1lc3NhZ2UiOiAiVG9vbC1mcmVlIGNyZWRlbnRp
            YWwgc21va2UgZml4dHVyZSBsb2FkZWQuIgp9Cg==
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$SMOKE_ROOT"
          mkdir -p \
            "$SMOKE_ROOT/bin" \
            "$SMOKE_ROOT/kiro-home" \
            "$SMOKE_ROOT/user-home" \
            "$SMOKE_ROOT/runtime" \
            "$SMOKE_ROOT/workspace/.kiro/agents"
          archive="$SMOKE_ROOT/kirocli-2.21.1.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$archive" \
            https://prod.download.cli.kiro.dev/stable/2.21.1/kirocli-x86_64-linux.tar.xz
          printf '%s  %s\n' \
            7fc0564fd02295a64470c4bf52752f5475f3280be3fa4dd9db255162e07e9825 \
            "$archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$SMOKE_ROOT/bin" \
            --strip-components=2 \
            kirocli/bin/kiro-cli \
            kirocli/bin/kiro-cli-chat
          test "$("$SMOKE_ROOT/bin/kiro-cli" --version)" = "kiro-cli 2.21.1"
          printf '%s' "$CI_AGENT_BASE64" | base64 --decode \
            >"$SMOKE_ROOT/workspace/.kiro/agents/pkstack-credential-smoke.json"
          printf '%s  %s\n' "$CI_AGENT_SHA256" \
            "$SMOKE_ROOT/workspace/.kiro/agents/pkstack-credential-smoke.json" \
            | sha256sum --check
          printf '%s' "$STREAM_VALIDATOR_BASE64" | base64 --decode \
            >"$SMOKE_ROOT/validate-stream.py"
          printf '%s  %s\n' "$STREAM_VALIDATOR_SHA256" \
            "$SMOKE_ROOT/validate-stream.py" | sha256sum --check
          printf '%s\n' 'PKStack credential smoke mutation sentinel.' \
            >"$SMOKE_ROOT/workspace/sentinel.txt"
          mkdir -m 0700 "$SMOKE_ROOT/kiro-home/settings"
          settings_path="$SMOKE_ROOT/kiro-home/settings/cli.json"
          install -m 0600 /dev/null "$settings_path"
          printf '%s\n' \
            '{' \
            '  "app.disableAutoupdates": true,' \
            '  "chat.disableInheritingDefaultResources": true,' \
            '  "telemetry.enabled": false' \
            '}' >"$settings_path"
          printf '%s  %s\n' \
            81d98ac813691c26f18f797ca5126c5150125cf74d2f6d413e152290074a6bd0 \
            "$settings_path" | sha256sum --check
          test "$(stat -c '%a' "$settings_path")" = 600
          test ! -e "$SMOKE_ROOT/kiro-home/settings/mcp.json"
          test ! -e "$SMOKE_ROOT/user-home/.kiro"
          find "$SMOKE_ROOT/workspace" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            >"$SMOKE_ROOT/workspace.sha256"
          chmod -R a-w "$SMOKE_ROOT/workspace"
      - name: Invoke one bounded no-tool Sol credential smoke
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          SMOKE_ROOT: ${{ runner.temp }}/pkstack-kiro-credential-smoke
        run: |
          set -euo pipefail
          : "${KIRO_API_KEY:?KIRO_API_KEY is not configured}"
          (
            cd "$SMOKE_ROOT/workspace"
            env -i \
              HOME="$SMOKE_ROOT/user-home" \
              KIRO_HOME="$SMOKE_ROOT/kiro-home" \
              PATH="$SMOKE_ROOT/bin:/usr/local/bin:/usr/bin:/bin" \
              LANG=C.UTF-8 \
              CI=true \
              NO_COLOR=1 \
              KIRO_LOG_NO_COLOR=1 \
              XDG_RUNTIME_DIR="$SMOKE_ROOT/runtime" \
              SSL_CERT_DIR=/etc/ssl/certs \
              KIRO_API_KEY="$KIRO_API_KEY" \
              "$SMOKE_ROOT/bin/kiro-cli" agent validate \
                --path "$SMOKE_ROOT/workspace/.kiro/agents/pkstack-credential-smoke.json"
          )
          stream="$SMOKE_ROOT/stream.jsonl"
          stderr="$SMOKE_ROOT/stderr.log"
          prompt='PK-STACK-KIRO-AUTH-OK'
          set +e
          (
            cd "$SMOKE_ROOT/workspace"
            env -i \
              HOME="$SMOKE_ROOT/user-home" \
              KIRO_HOME="$SMOKE_ROOT/kiro-home" \
              PATH="$SMOKE_ROOT/bin:/usr/local/bin:/usr/bin:/bin" \
              LANG=C.UTF-8 \
              CI=true \
              NO_COLOR=1 \
              KIRO_LOG_NO_COLOR=1 \
              XDG_RUNTIME_DIR="$SMOKE_ROOT/runtime" \
              SSL_CERT_DIR=/etc/ssl/certs \
              KIRO_API_KEY="$KIRO_API_KEY" \
              timeout --signal=TERM --kill-after=5s 120s \
              "$SMOKE_ROOT/bin/kiro-cli" chat \
                --v3 \
                --agent pkstack-credential-smoke \
                --model gpt-5.6-sol \
                --effort max \
                --no-interactive \
                --trust-tools= \
                --output-format stream-json \
                "$prompt"
          ) >"$stream" 2>"$stderr"
          kiro_rc=$?
          set -e
          if grep -Fq 'not found, using "default"' "$stderr"; then
            printf '%s\n' \
              'Kiro fell back from the exact credential fixture to default.' >&2
            exit 1
          fi
          actual_workspace_sha256=$(
            find "$SMOKE_ROOT/workspace" -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum
          )
          expected_workspace_sha256=$(cat "$SMOKE_ROOT/workspace.sha256")
          test "$actual_workspace_sha256" = "$expected_workspace_sha256"
          test -z "$(find "$SMOKE_ROOT/workspace" -perm /222 -print -quit)"
          python3 "$SMOKE_ROOT/validate-stream.py" \
            --stream "$stream" \
            --stderr "$stderr" \
            --return-code "$kiro_rc" \
            --require-review-model
          printf '%s\n' 'Kiro API credential authenticated through one no-tool Sol exchange and advertised Claude Opus 5 with xhigh effort support.'
      - name: Remove every credential-smoke runtime and log
        if: always()
        env:
          SMOKE_ROOT: ${{ runner.temp }}/pkstack-kiro-credential-smoke
        run: |
          set -euo pipefail
          case "$SMOKE_ROOT" in
            "$RUNNER_TEMP"/pkstack-kiro-credential-smoke) ;;
            *) exit 1 ;;
          esac
          if [ -e "$SMOKE_ROOT" ] || [ -L "$SMOKE_ROOT" ]; then
            test -d "$SMOKE_ROOT"
            test ! -L "$SMOKE_ROOT"
            test -O "$SMOKE_ROOT"
            chmod -R u+rwX "$SMOKE_ROOT"
            rm -rf -- "$SMOKE_ROOT"
          fi
          test ! -e "$SMOKE_ROOT"
          test ! -L "$SMOKE_ROOT"
