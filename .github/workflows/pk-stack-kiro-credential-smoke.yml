          CI_AGENT_BASE64: |-
            ewogICJuYW1lIjogInBrc3RhY2stY3JlZGVudGlhbC1zbW9rZSIsCiAgImRlc2NyaXB0aW9uIjogIkltbXV0YWJsZSBDSS1vbmx5
