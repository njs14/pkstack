        run: |
          set -euo pipefail
          umask 077
          test ! -e "$SMOKE_ROOT"
          mkdir -p \
            "$SMOKE_ROOT/bin" \
            "$SMOKE_ROOT/kiro-home/agents" \
            "$SMOKE_ROOT/user-home" \
            "$SMOKE_ROOT/runtime" \
            "$SMOKE_ROOT/workspace/.pk-stack-ci"
          archive="$SMOKE_ROOT/kirocli-2.21.0.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$archive" \
            https://prod.download.cli.kiro.dev/stable/2.21.0/kirocli-x86_64-linux.tar.xz
          printf '%s  %s\n' \
            6eccb46617a84690fc892219f264f7617312761c9a3d7e38cc47a0e2ab0152b7 \
            "$archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$SMOKE_ROOT/bin" \
            --strip-components=2 \
            kirocli/bin/kiro-cli \
            kirocli/bin/kiro-cli-chat
          test "$("$SMOKE_ROOT/bin/kiro-cli" --version)" = "kiro-cli 2.21.0"
          printf '%s' "$CI_AGENT_BASE64" | base64 --decode \
            >"$SMOKE_ROOT/kiro-home/agents/pstack-maintainer.json"
          printf '%s  %s\n' "$CI_AGENT_SHA256" \
            "$SMOKE_ROOT/kiro-home/agents/pstack-maintainer.json" | sha256sum --check
          printf '%s' "$STREAM_VALIDATOR_BASE64" | base64 --decode \
            >"$SMOKE_ROOT/validate-stream.py"
          printf '%s  %s\n' "$STREAM_VALIDATOR_SHA256" \
            "$SMOKE_ROOT/validate-stream.py" | sha256sum --check
          printf '%s\n' 'Credential smoke fixture. Do not invoke tools.' \
            >"$SMOKE_ROOT/workspace/AGENTS.md"
          printf '%s\n' '{}' \
            >"$SMOKE_ROOT/workspace/.pk-stack-ci/upstream-delta.json"
          printf '%s\n' 'Credential smoke only; no maintenance work is authorized.' \
            >"$SMOKE_ROOT/workspace/.pk-stack-ci/verification-feedback.txt"
          (
            cd "$SMOKE_ROOT"
            HOME="$SMOKE_ROOT/user-home" KIRO_HOME="$SMOKE_ROOT/kiro-home" \
              "$SMOKE_ROOT/bin/kiro-cli" settings chat.disableInheritingDefaultResources true
            HOME="$SMOKE_ROOT/user-home" KIRO_HOME="$SMOKE_ROOT/kiro-home" \
              "$SMOKE_ROOT/bin/kiro-cli" settings app.disableAutoupdates true
            HOME="$SMOKE_ROOT/user-home" KIRO_HOME="$SMOKE_ROOT/kiro-home" \
              "$SMOKE_ROOT/bin/kiro-cli" settings telemetry.enabled false
            HOME="$SMOKE_ROOT/user-home" KIRO_HOME="$SMOKE_ROOT/kiro-home" \
              "$SMOKE_ROOT/bin/kiro-cli" agent validate \
              --path "$SMOKE_ROOT/kiro-home/agents/pstack-maintainer.json"
          )
          find "$SMOKE_ROOT/workspace" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            >"$SMOKE_ROOT/workspace.sha256"
          chmod -R a-w "$SMOKE_ROOT/workspace"
      - name: Invoke one bounded no-tool Sol credential smoke
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          SMOKE_ROOT: ${{ runner.temp }}/pk-stack-kiro-credential-smoke
        run: |
          set -euo pipefail
          : "${KIRO_API_KEY:?KIRO_API_KEY is not configured}"
          stream="$SMOKE_ROOT/stream.jsonl"
          stderr="$SMOKE_ROOT/stderr.log"
          prompt='Authentication smoke only. Invoke no tools and reply exactly PK-STACK-KIRO-AUTH-OK.'
          set +e
          (
            cd "$SMOKE_ROOT/workspace"
            env -i \
              HOME="$SMOKE_ROOT/user-home" \
              KIRO_HOME="$SMOKE_ROOT/kiro-home" \
              PATH="$SMOKE_ROOT/bin:/usr/local/bin:/usr/bin:/bin" \
              LANG=C.UTF-8 \
              CI=true \
              NO_COLOR=1 \
              KIRO_LOG_NO_COLOR=1 \
              XDG_RUNTIME_DIR="$SMOKE_ROOT/runtime" \
              SSL_CERT_DIR=/etc/ssl/certs \
              KIRO_API_KEY="$KIRO_API_KEY" \
              timeout --signal=TERM --kill-after=5s 120s \
              "$SMOKE_ROOT/bin/kiro-cli" chat \
                --v3 \
                --agent pstack-maintainer \
                --model gpt-5.6-sol \
                --effort max \
                --no-interactive \
                --trust-tools= \
                --output-format stream-json \
                "$prompt"
          ) >"$stream" 2>"$stderr"
          kiro_rc=$?
          set -e
          actual_workspace_sha256=$(
            find "$SMOKE_ROOT/workspace" -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum
          )
          expected_workspace_sha256=$(cat "$SMOKE_ROOT/workspace.sha256")
          test "$actual_workspace_sha256" = "$expected_workspace_sha256"
          test -z "$(find "$SMOKE_ROOT/workspace" -perm /222 -print -quit)"
          python3 "$SMOKE_ROOT/validate-stream.py" \
            --stream "$stream" \
            --stderr "$stderr" \
            --return-code "$kiro_rc"
          printf '%s\n' 'Kiro API credential authenticated through one no-tool Sol exchange with max requested.'
      - name: Remove every credential-smoke runtime and log
        if: always()
        env:
          SMOKE_ROOT: ${{ runner.temp }}/pk-stack-kiro-credential-smoke
        run: |
          set -euo pipefail
          case "$SMOKE_ROOT" in
            "$RUNNER_TEMP"/pk-stack-kiro-credential-smoke) ;;
            *) exit 1 ;;
          esac
          rm -rf -- "$SMOKE_ROOT"
          test ! -e "$SMOKE_ROOT"
