name: PKStack CI

on:
  push:
    branches: [main]
  # Stacked pull requests need the same read-only checks as main-targeted PRs.
  pull_request:
  # GITHUB_TOKEN merges do not trigger push CI; the trusted merge job dispatches it.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit to verify
        required: true
        type: string

permissions: {}

concurrency:
  group: pkstack-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden read-only CI networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select coverage inside the verification job
        id: profile
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha }}
          CHECK_HEAD: ${{ github.sha }}
        run: |
          python3 -B .github/scripts/pkstack_checks.py classify \
            --event "$CHECK_EVENT" --base "$CHECK_BASE" --head "$CHECK_HEAD"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Materialize the locked Power environment
        run: uv sync --quiet --locked --all-groups --project .
      - name: Install checksum-pinned static analyzers
        if: steps.profile.outputs.profile == 'normal'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          STATIC_TOOLS: ${{ runner.temp }}/pkstack-static-tools
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$STATIC_TOOLS/bin"
          actionlint_archive="$STATIC_TOOLS/actionlint.tar.gz"
          shellcheck_archive="$STATIC_TOOLS/shellcheck.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check
          tar --extract --gzip --file "$actionlint_archive" --directory "$STATIC_TOOLS/bin" \
            actionlint
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check
          tar --extract --xz --file "$shellcheck_archive" --directory "$STATIC_TOOLS/bin" \
            --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          chmod 0555 "$STATIC_TOOLS/bin/actionlint" "$STATIC_TOOLS/bin/shellcheck"
          printf '%s\n' "$STATIC_TOOLS/bin" >>"$GITHUB_PATH"
          export PATH="$STATIC_TOOLS/bin:$PATH"
          actionlint -version
          shellcheck --version | sed -n '1,4p'
      - name: Run complete shared verification
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha }}
          CHECK_HEAD: ${{ github.sha }}
        run: |
          python3 -B .github/scripts/pkstack_checks.py hosted \
            --event "$CHECK_EVENT" --base "$CHECK_BASE" --head "$CHECK_HEAD" \
            --output "$RUNNER_TEMP/pkstack-ci"
      - name: Retain verification summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/diagnostics
          if-no-files-found: warn
          retention-days: 14
  package:
    needs: deterministic
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.deterministic.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden read-only CI networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Materialize the locked Power environment
        run: uv sync --quiet --locked --all-groups --project .
      - name: Build and validate reproducible main artifact
        run: |
          python3 -B .github/scripts/pkstack_ci_package.py build \
            --repo-root . --output-dir "$RUNNER_TEMP/pkstack-release-package" \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain immutable release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-release-package/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
