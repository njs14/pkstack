name: PKStack CI

on:
  push:
    branches: [main]
  # Stacked pull requests need the same read-only checks as main-targeted PRs.
  pull_request:

permissions: {}

concurrency:
  group: pkstack-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      browser_profile: ${{ steps.plan.outputs.browser_profile }}
    steps:
      - name: Harden read-only CI networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select explicit coverage profile
        id: plan
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha }}
          CHECK_HEAD: ${{ github.sha }}
        run: |
          python3 -B .github/scripts/pkstack_checks.py classify \
            --event "$CHECK_EVENT" --base "$CHECK_BASE" --head "$CHECK_HEAD" \
            --output "$RUNNER_TEMP/pkstack-ci/plan/plan.json"
      - name: Save immutable execution plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/plan/plan.json
          if-no-files-found: error
          retention-days: 14
  fast:
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden read-only CI networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkstack-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/plan
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Materialize the locked Power environment
        run: uv sync --quiet --locked --all-groups --project powers/pkstack
      - name: Run shared fast checks
        env:
          PKSTACK_DIAGNOSTICS: ${{ runner.temp }}/pkstack-ci/diagnostics
          CHECK_LANE: fast
        run: |
          python3 -B .github/scripts/pkstack_checks.py run \
            --plan "$RUNNER_TEMP/pkstack-ci/plan/plan.json" --lane "$CHECK_LANE" \
            --receipt "$RUNNER_TEMP/pkstack-ci/receipts/$CHECK_LANE.json"
      - name: Retain fast receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-receipt-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/receipts/*.json
          if-no-files-found: error
          retention-days: 14
  browser:
    needs: classify
    if: needs.classify.outputs.profile == 'normal'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden read-only CI networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkstack-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/plan
      - name: Install uv
        if: needs.classify.outputs.profile == 'normal'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Materialize the locked Power environment
        if: needs.classify.outputs.profile == 'normal'
        run: uv sync --quiet --locked --all-groups --project powers/pkstack
      - name: Require browser runtime
        run: |
          set -euo pipefail
          node --version
          google-chrome --version
      - name: Run shared browser checks
        env:
          PKSTACK_DIAGNOSTICS: ${{ runner.temp }}/pkstack-ci/diagnostics
          CHECK_LANE: browser
        run: |
          python3 -B .github/scripts/pkstack_checks.py run \
            --plan "$RUNNER_TEMP/pkstack-ci/plan/plan.json" --lane "$CHECK_LANE" \
            --receipt "$RUNNER_TEMP/pkstack-ci/receipts/$CHECK_LANE.json"
      - name: Retain browser receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-receipt-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/receipts/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed browser screenshots and fixture diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/diagnostics/browser
          if-no-files-found: warn
          retention-days: 14
  package:
    needs: classify
    if: needs.classify.outputs.profile == 'normal'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden read-only CI networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkstack-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/plan
      - name: Install uv
        if: needs.classify.outputs.profile == 'normal'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Materialize the locked Power environment
        if: needs.classify.outputs.profile == 'normal'
        run: uv sync --quiet --locked --all-groups --project powers/pkstack
      - name: Run shared package checks
        env:
          PKSTACK_DIAGNOSTICS: ${{ runner.temp }}/pkstack-ci/diagnostics
          CHECK_LANE: package
        run: |
          python3 -B .github/scripts/pkstack_checks.py run \
            --plan "$RUNNER_TEMP/pkstack-ci/plan/plan.json" --lane "$CHECK_LANE" \
            --receipt "$RUNNER_TEMP/pkstack-ci/receipts/$CHECK_LANE.json"
      - name: Build and validate reproducible main artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 -B .github/scripts/pkstack_ci_package.py build \
            --repo-root . --output-dir "$RUNNER_TEMP/pkstack-release-package" \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain immutable release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-release-package/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain package receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-receipt-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/receipts/*.json
          if-no-files-found: error
          retention-days: 14
  core:
    needs: classify
    if: needs.classify.outputs.profile == 'normal'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Harden read-only CI networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkstack-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/plan
      - name: Install uv
        if: needs.classify.outputs.profile == 'normal'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Materialize the locked Power environment
        if: needs.classify.outputs.profile == 'normal'
        run: uv sync --quiet --locked --all-groups --project powers/pkstack
      - name: Run shared core checks
        env:
          PKSTACK_DIAGNOSTICS: ${{ runner.temp }}/pkstack-ci/diagnostics
          CHECK_LANE: core-${{ matrix.shard }}
        run: |
          python3 -B .github/scripts/pkstack_checks.py run \
            --plan "$RUNNER_TEMP/pkstack-ci/plan/plan.json" --lane "$CHECK_LANE" \
            --receipt "$RUNNER_TEMP/pkstack-ci/receipts/$CHECK_LANE.json"
      - name: Retain core receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-receipt-core-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/receipts/*.json
          if-no-files-found: error
          retention-days: 14
  policy:
    needs: classify
    if: needs.classify.outputs.profile == 'normal'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden read-only CI networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkstack-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/plan
      - name: Install uv
        if: needs.classify.outputs.profile == 'normal'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Materialize the locked Power environment
        if: needs.classify.outputs.profile == 'normal'
        run: uv sync --quiet --locked --all-groups --project powers/pkstack
      - name: Install checksum-pinned static analyzers
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          STATIC_TOOLS: ${{ runner.temp }}/pkstack-static-tools
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$STATIC_TOOLS/bin"
          actionlint_archive="$STATIC_TOOLS/actionlint.tar.gz"
          shellcheck_archive="$STATIC_TOOLS/shellcheck.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check
          tar --extract --gzip --file "$actionlint_archive" --directory "$STATIC_TOOLS/bin" \
            actionlint
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check
          tar --extract --xz --file "$shellcheck_archive" --directory "$STATIC_TOOLS/bin" \
            --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          chmod 0555 "$STATIC_TOOLS/bin/actionlint" "$STATIC_TOOLS/bin/shellcheck"
          printf '%s\n' "$STATIC_TOOLS/bin" >>"$GITHUB_PATH"
          export PATH="$STATIC_TOOLS/bin:$PATH"
          actionlint -version
          shellcheck --version | sed -n '1,4p'
      - name: Run shared policy checks
        env:
          PKSTACK_DIAGNOSTICS: ${{ runner.temp }}/pkstack-ci/diagnostics
          CHECK_LANE: policy
        run: |
          python3 -B .github/scripts/pkstack_checks.py run \
            --plan "$RUNNER_TEMP/pkstack-ci/plan/plan.json" --lane "$CHECK_LANE" \
            --receipt "$RUNNER_TEMP/pkstack-ci/receipts/$CHECK_LANE.json"
      - name: Retain policy receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-receipt-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/receipts/*.json
          if-no-files-found: error
          retention-days: 14
  deterministic:
    if: always()
    needs: [classify, fast, browser, package, core, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden read-only CI networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkstack-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/plan
      - name: Download execution receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkstack-receipt-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/receipts
          merge-multiple: true
      - name: Require complete disjoint passing execution
        env:
          CHECK_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -B .github/scripts/pkstack_checks.py aggregate \
            --plan "$RUNNER_TEMP/pkstack-ci/plan/plan.json" --receipts "$RUNNER_TEMP/pkstack-ci/receipts" \
            --needs "$CHECK_NEEDS" --output "$RUNNER_TEMP/pkstack-ci/summary/summary.json"
      - name: Retain timing and aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkstack-ci/summary/summary.json
          if-no-files-found: warn
          retention-days: 30
