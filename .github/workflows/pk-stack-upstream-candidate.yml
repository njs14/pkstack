name: PKStack Upstream Candidate Gate
run-name: PKStack candidate gate for source run ${{ github.event.workflow_run.id }}

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Trusted default-branch controls bind one policy-limited commit; tests are secretless, Kiro peer review is no-tool/isolated, and merge revalidates immutable SHAs.
    workflows:
      - PKStack Upstream Maintenance (Kiro)
    types: [completed]

permissions: {}

concurrency:
  group: pkstack-upstream-candidate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv

jobs:
  resolve:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_candidate: ${{ steps.resolve.outputs.has_candidate }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      default_branch: ${{ steps.resolve.outputs.default_branch }}
      source_provider: ${{ steps.resolve.outputs.source_provider }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_workflow: ${{ steps.resolve.outputs.source_workflow }}
      source_workflow_path: ${{ steps.resolve.outputs.source_workflow_path }}
      candidate_branch: ${{ steps.resolve.outputs.candidate_branch }}
    steps:
      - name: Harden runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            github.com:443
      - name: Check out exact trusted source controls only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve and validate exact maintenance candidate
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const { resolveCandidateForSource } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pkstack_pr_policy.js`
            );
            const { owner, repo } = context.repo;
            const repository = (await github.rest.repos.get({ owner, repo })).data;
            const policyResponse = await github.rest.repos.getContent({
              owner, repo, path: ".github/pkstack-maintenance-policy.json", ref: process.env.SOURCE_SHA,
            });
            if (Array.isArray(policyResponse.data) || policyResponse.data.type !== "file") {
              core.setFailed("trusted maintenance policy is unavailable");
              return;
            }
            const policy = JSON.parse(Buffer.from(policyResponse.data.content, "base64").toString("utf8"));
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", base: repository.default_branch, per_page: 100,
            });
            let resolved;
            try {
              resolved = resolveCandidateForSource({
                pulls,
                sourceRun: context.payload.workflow_run,
                policy,
                baseSha: process.env.SOURCE_SHA,
                defaultBranch: repository.default_branch,
                repositoryFullName: `${owner}/${repo}`,
                expectedProvider: "kiro",
              });
            } catch (error) {
              core.setFailed(error.message);
              return;
            }
            core.setOutput("source_provider", resolved.source.provider);
            core.setOutput("source_run_id", resolved.source.runIdText);
            core.setOutput("source_workflow", resolved.source.workflowName);
            core.setOutput("source_workflow_path", resolved.source.workflowPath);
            core.setOutput("candidate_branch", resolved.source.expectedHeadRef);
            if (resolved.pull === null) {
              core.info("successful source run produced no current-base candidate");
              core.setOutput("has_candidate", "false");
              return;
            }
            const pull = resolved.pull;
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${process.env.SOURCE_SHA}...${pull.head.sha}`,
            })).data;
            if (comparison.status !== "ahead" || comparison.ahead_by !== 1
                || comparison.behind_by !== 0 || comparison.total_commits !== 1) {
              core.setFailed("candidate must be exactly one commit atop the source SHA");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pull.number, per_page: 100,
            });
            if (files.length === 0 || files.length > policy.limits.max_changed_files) {
              core.setFailed("candidate changed-file count is outside policy");
              return;
            }
            const exact = new Set(policy.final_allowed_exact);
            const protectedExact = new Set(policy.protected_exact);
            const allowed = (path) => exact.has(path) || Object.entries(policy.final_allowed_prefixes)
              .some(([prefix, suffixes]) => path.startsWith(prefix) && suffixes.some((suffix) => path.endsWith(suffix)));
            const protectedPath = (path) => protectedExact.has(path)
              || policy.protected_prefixes.some((prefix) => path.startsWith(prefix));
            let changedLines = 0;
            for (const file of files) {
              if (["renamed", "copied"].includes(file.status) || protectedPath(file.filename) || !allowed(file.filename)) {
                core.setFailed(`candidate path violates policy: ${file.filename}`);
                return;
              }
              if (file.patch === undefined || file.patch === null) {
                core.setFailed(`binary or unbounded patch is forbidden: ${file.filename}`);
                return;
              }
              changedLines += file.additions + file.deletions;
            }
            if (changedLines > policy.limits.max_changed_lines) {
              core.setFailed("candidate changed-line count exceeds policy");
              return;
            }
            const tree = (await github.rest.git.getTree({
              owner, repo, tree_sha: pull.head.sha, recursive: "true",
            })).data;
            if (tree.truncated) {
              core.setFailed("candidate tree response was truncated");
              return;
            }
            const treeByPath = new Map(tree.tree.map((entry) => [entry.path, entry]));
            for (const file of files.filter((item) => item.status !== "removed")) {
              const entry = treeByPath.get(file.filename);
              const expectedMode = [".pkstack/bin/projectctl", "projectctl"].includes(file.filename) ? "100755" : "100644";
              if (!entry || entry.type !== "blob" || entry.mode !== expectedMode) {
                core.setFailed(`candidate git object or mode is invalid: ${file.filename}`);
                return;
              }
            }
            core.setOutput("has_candidate", "true");
            core.setOutput("pr_number", String(pull.number));
            core.setOutput("head_sha", pull.head.sha);
            core.setOutput("base_sha", process.env.SOURCE_SHA);
            core.setOutput("default_branch", repository.default_branch);

  base_tests:
    needs: resolve
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tested_sha: ${{ steps.immutable.outputs.tested_sha }}
    steps:
      - name: Harden read-only base test runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out exact trusted base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Run exact-base static regression gates with no secrets
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          uv sync --quiet --locked --all-groups --project powers/pkstack
          .pkstack/bin/projectctl feature validate --output json
          .pkstack/bin/projectctl version --output json
          .pkstack/bin/projectctl knowledge validate --output json
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test .github/scripts/test_pkstack_pr_policy.js
          # One shared entrypoint covers every maintained Power, root and embedded
          # Python surface, including `uv lock --check`.
          python3 -B .github/scripts/pkstack_python_static.py --repo-root .
          uv run --frozen --project powers/pkstack pytest -q
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Bind successful base gates to base SHA
        id: immutable
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'tested_sha=%s\n' "$EXPECTED_SHA" >>"$GITHUB_OUTPUT"

  candidate_prepare:
    needs: resolve
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      selected_source_id: ${{ steps.selection.outputs.selected_source_id }}
      source_subtree_sha: ${{ steps.selection.outputs.source_subtree_sha }}
      source_commit: ${{ steps.selection.outputs.expected_head }}
      retry_override: ${{ steps.selection.outputs.retry_override }}
      review_artifact_id: ${{ steps.upload_review.outputs.artifact-id }}
      review_content_sha256: ${{ steps.review_bundle.outputs.content_sha256 }}
      review_patch_sha256: ${{ steps.review_bundle.outputs.patch_sha256 }}
      review_paths_sha256: ${{ steps.review_bundle.outputs.paths_sha256 }}
      review_changed_files: ${{ steps.review_bundle.outputs.changed_files }}
    steps:
      - name: Harden read-only test runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out exact untrusted candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Download immutable source detector and controller selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkstack-detector-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pkstack-source-plan
      - name: Snapshot immutable base controller and review guards
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          TRUSTED_ROOT: ${{ runner.temp }}/pkstack-candidate-trusted
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          mkdir -p "$TRUSTED_ROOT"
          git archive "$BASE_SHA" \
            Wiki/features/pkstack-upstream-maintenance.md \
            .pkstack/projectctl \
            .github/agent-memory/pkstack-upstream.md \
            .github/fixtures \
            .github/pkstack-maintenance-policy.json \
            .github/scripts \
            .github/workflows \
            .kiro/agents \
            | tar -x -C "$TRUSTED_ROOT"
          uv sync --quiet --locked --no-config --project "$TRUSTED_ROOT/.pkstack/projectctl"
          python3 "$TRUSTED_ROOT/.github/scripts/pkstack_maintenance_guard.py" \
            --root . \
            --policy "$TRUSTED_ROOT/.github/pkstack-maintenance-policy.json" \
            validate-trusted-snapshot \
            --base "$BASE_SHA" \
            --trusted-root "$TRUSTED_ROOT"
          chmod -R a-w "$TRUSTED_ROOT"
      - name: Revalidate sole controller source selection
        id: selection
        env:
          TRUSTED_ROOT: ${{ runner.temp }}/pkstack-candidate-trusted
        run: |
          python3 "$TRUSTED_ROOT/.github/scripts/pkstack_maintenance_guard.py" \
            --github-output "$GITHUB_OUTPUT" validate-control-plan \
            --detector "$RUNNER_TEMP/pkstack-source-plan/upstream-check.json" \
            --control-plan "$RUNNER_TEMP/pkstack-source-plan/control-plan.json"
      - name: Validate candidate source acceptance with trusted controls
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.head_sha }}
          READONLY_GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_ROOT: ${{ runner.temp }}/pkstack-candidate-trusted
          SELECTED_SOURCE_ID: ${{ steps.selection.outputs.selected_source_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          trusted_projectctl() {
            PYTHONPATH="$TRUSTED_ROOT/.pkstack/projectctl/src" \
              "$TRUSTED_ROOT/.pkstack/projectctl/.venv/bin/python" \
              -B -X pycache_prefix=/dev/null -m pkstack "$@"
          }
          set +e
          GITHUB_TOKEN="$READONLY_GITHUB_TOKEN" trusted_projectctl upstream check \
            --manifest maintenance/upstreams.json \
            --power-root powers/pkstack \
            --output json >"$RUNNER_TEMP/pkstack-candidate-detector.json"
          detector_rc=$?
          set -e
          python3 "$TRUSTED_ROOT/.github/scripts/pkstack_maintenance_guard.py" validate-detector \
            --detector "$RUNNER_TEMP/pkstack-candidate-detector.json"
          if [[ -n "$SELECTED_SOURCE_ID" ]]; then
            python3 "$TRUSTED_ROOT/.github/scripts/pkstack_maintenance_guard.py" \
              validate-serialized-acceptance --base "$BASE_SHA" \
              --before-detector "$RUNNER_TEMP/pkstack-source-plan/upstream-check.json" \
              --after-detector "$RUNNER_TEMP/pkstack-candidate-detector.json" \
              --selected-source-id "$SELECTED_SOURCE_ID"
            GITHUB_TOKEN="$READONLY_GITHUB_TOKEN" trusted_projectctl upstream check \
              --manifest maintenance/upstreams.json --power-root powers/pkstack \
              --source-id "$SELECTED_SOURCE_ID" --output json
          else
            test "$detector_rc" -eq 0
          fi
          unset READONLY_GITHUB_TOKEN
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build deterministic exact-candidate review input
        id: review_bundle
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          REVIEW_PATH: ${{ runner.temp }}/pkstack-candidate-review/review-input.json
          TRUSTED_ROOT: ${{ runner.temp }}/pkstack-candidate-trusted
        run: |
          set -euo pipefail
          python3 "$TRUSTED_ROOT/.github/scripts/pkstack_maintenance_guard.py" \
            --root . \
            --policy "$TRUSTED_ROOT/.github/pkstack-maintenance-policy.json" \
            --github-output "$GITHUB_OUTPUT" \
            build-candidate-review-bundle \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$REVIEW_PATH"
      - name: Upload exact candidate review input
        id: upload_review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-candidate-review-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/pkstack-candidate-review/review-input.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  candidate_tests:
    needs: [resolve, candidate_prepare]
    if: needs.resolve.outputs.has_candidate == 'true' && needs.candidate_prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tested_sha: ${{ steps.immutable.outputs.tested_sha }}
    steps:
      - name: Harden read-only test runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out exact untrusted candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Snapshot immutable base controller and review guards
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          TRUSTED_ROOT: ${{ runner.temp }}/pkstack-candidate-trusted
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          mkdir -p "$TRUSTED_ROOT"
          git archive "$BASE_SHA" \
            Wiki/features/pkstack-upstream-maintenance.md \
            .pkstack/projectctl \
            .github/agent-memory/pkstack-upstream.md \
            .github/fixtures \
            .github/pkstack-maintenance-policy.json \
            .github/scripts \
            .github/workflows \
            .kiro/agents \
            | tar -x -C "$TRUSTED_ROOT"
          uv sync --quiet --locked --no-config --project "$TRUSTED_ROOT/.pkstack/projectctl"
          python3 "$TRUSTED_ROOT/.github/scripts/pkstack_maintenance_guard.py" \
            --root . \
            --policy "$TRUSTED_ROOT/.github/pkstack-maintenance-policy.json" \
            validate-trusted-snapshot \
            --base "$BASE_SHA" \
            --trusted-root "$TRUSTED_ROOT"
          chmod -R a-w "$TRUSTED_ROOT"
      - name: Run candidate gates without credentials
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.head_sha }}
          COVERAGE_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          TRUSTED_ROOT: ${{ runner.temp }}/pkstack-candidate-trusted
          PKSTACK_BROWSER_PROFILE: full
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          uv sync --quiet --locked --all-groups --project powers/pkstack
          trusted_projectctl() {
            PYTHONPATH="$TRUSTED_ROOT/.pkstack/projectctl/src" \
              "$TRUSTED_ROOT/.pkstack/projectctl/.venv/bin/python" \
              -B -X pycache_prefix=/dev/null -m pkstack "$@"
          }
          trusted_projectctl feature validate --output json
          trusted_projectctl version --output json
          trusted_projectctl knowledge validate --output json
          PYTHONPATH="$TRUSTED_ROOT/.pkstack/projectctl/src" \
            "$TRUSTED_ROOT/.pkstack/projectctl/.venv/bin/python" -B \
            "$TRUSTED_ROOT/.github/scripts/pkstack_knowledge_coverage.py" \
            --repo-root . --base "$COVERAGE_BASE_SHA"
          # Protected controls match the base; discovery also includes the
          # maintenance guard and stream regressions, once each.
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test .github/scripts/test_pkstack_pr_policy.js
          # One shared entrypoint covers every maintained Power, root and embedded
          # Python surface, including `uv lock --check`.
          python3 -B .github/scripts/pkstack_python_static.py --repo-root .
          uv run --frozen --project powers/pkstack pytest -q
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Bind successful gates to candidate SHA
        id: immutable
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'tested_sha=%s\n' "$EXPECTED_SHA" >>"$GITHUB_OUTPUT"

  kiro_peer_review:
    needs: [resolve, candidate_prepare]
    if: needs.resolve.outputs.has_candidate == 'true' && needs.candidate_prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      review_verdict: ${{ steps.validate.outputs.review_verdict }}
      report_sha256: ${{ steps.validate.outputs.report_sha256 }}
      report_artifact_id: ${{ steps.upload_report.outputs.artifact-id }}
      reviewed_base_sha: ${{ steps.validate.outputs.reviewed_base_sha }}
      reviewed_head_sha: ${{ steps.validate.outputs.reviewed_head_sha }}
      reviewed_content_sha256: ${{ steps.validate.outputs.reviewed_content_sha256 }}
      reviewed_patch_sha256: ${{ steps.validate.outputs.reviewed_patch_sha256 }}
      reviewed_changed_files: ${{ steps.validate.outputs.reviewed_changed_files }}
      reviewed_paths_sha256: ${{ steps.validate.outputs.reviewed_paths_sha256 }}
      reviewed_agent: ${{ steps.validate.outputs.reviewed_agent }}
      reviewed_model: ${{ steps.validate.outputs.reviewed_model }}
      reviewed_effort: ${{ steps.validate.outputs.reviewed_effort }}
      execution_evidence_sha256: ${{ steps.validate.outputs.execution_evidence_sha256 }}
      verdict_sha256: ${{ steps.validate.outputs.verdict_sha256 }}
      attestation_sha256: ${{ steps.validate.outputs.attestation_sha256 }}
    env:
      REVIEW_MODEL: claude-opus-5
      REVIEW_EFFORT: xhigh
    steps:
      - name: Harden isolated Kiro peer-review networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            app.kiro.dev:443
            assets.app.kiro.dev:443
            cli.kiro.dev:443
            desktop-release.q.us-east-1.amazonaws.com:443
            github.com:443
            management.eu-central-1.kiro.dev:443
            management.us-east-1.kiro.dev:443
            objects.githubusercontent.com:443
            prod.download.cli.kiro.dev:443
            prod.download.desktop.kiro.dev:443
            prod.us-east-1.auth.desktop.kiro.dev:443
            prod.us-east-1.telemetry.desktop.kiro.dev:443
            q.eu-central-1.amazonaws.com:443
            q.us-east-1.amazonaws.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            runtime.eu-central-1.kiro.dev:443
            runtime.us-east-1.kiro.dev:443
            telemetry.eu-central-1.kiro.dev:443
            telemetry.us-east-1.kiro.dev:443
            *.blob.core.windows.net:443
      - name: Check out exact trusted review controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted-review-control
          persist-credentials: false
          fetch-depth: 1
      - name: Bind isolated reviewer paths
        run: |
          set -euo pipefail
          {
            printf 'TRUSTED_REVIEW_ROOT=%s\n' "$GITHUB_WORKSPACE/trusted-review-control"
            printf 'REVIEW_WORKSPACE=%s\n' "$RUNNER_TEMP/pkstack-peer-review-workspace"
            printf 'REVIEW_PRIVATE=%s\n' "$RUNNER_TEMP/pkstack-peer-review-private"
            printf 'KIRO_BIN_DIR=%s\n' "$RUNNER_TEMP/kiro-review-bin"
            printf 'KIRO_ARCHIVE=%s\n' "$RUNNER_TEMP/kiro-review-cache/kirocli-2.21.1.tar.xz"
            printf 'KIRO_HOME=%s\n' "$RUNNER_TEMP/kiro-review-user-home/.kiro"
            printf 'KIRO_USER_HOME=%s\n' "$RUNNER_TEMP/kiro-review-user-home"
          } >>"$GITHUB_ENV"
      - name: Restore pinned Kiro CLI archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kiro-review-cache/kirocli-2.21.1.tar.xz
          key: kiro-cli-linux-x86-64-2.21.1-7fc0564fd02295a64470c4bf52752f5475f3280be3fa4dd9db255162e07e9825
      - name: Verify checksum-pinned Kiro CLI 2.21.1 archive
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KIRO_ARCHIVE")"
          if [[ ! -f "$KIRO_ARCHIVE" ]]; then
            curl --proto '=https' --tlsv1.2 --fail --location               --retry 3 --retry-all-errors --output "$KIRO_ARCHIVE"               https://prod.download.cli.kiro.dev/stable/2.21.1/kirocli-x86_64-linux.tar.xz
          fi
          printf '%s  %s\n'             7fc0564fd02295a64470c4bf52752f5475f3280be3fa4dd9db255162e07e9825             "$KIRO_ARCHIVE" | sha256sum --check
      - name: Download exact candidate review input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate_prepare.outputs.review_artifact_id }}
          path: ${{ runner.temp }}/pkstack-peer-review-input
      - name: Prepare immutable no-tool Kiro reviewer
        env:
          EXPECTED_CONTENT_SHA256: ${{ needs.candidate_prepare.outputs.review_content_sha256 }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/pkstack-peer-review-input/review-input.json"
          printf '%s  %s\n' "$EXPECTED_CONTENT_SHA256" "$input" | sha256sum --check
          mkdir -m 0700 "$REVIEW_WORKSPACE" "$REVIEW_WORKSPACE/.pkstack-ci" "$REVIEW_PRIVATE"
          install -m 0400 "$input" "$REVIEW_WORKSPACE/.pkstack-ci/review-input.json"
          TRUSTED_ROOT="$TRUSTED_REVIEW_ROOT"             KIRO_AGENT_NAME=pkstack-ci-reviewer             bash "$TRUSTED_REVIEW_ROOT/.github/scripts/prepare_kiro_maintenance_runtime.sh"
          env -i             HOME="$KIRO_USER_HOME"             KIRO_HOME="$KIRO_HOME"             PATH="$KIRO_BIN_DIR:/usr/local/bin:/usr/bin:/bin"             LANG=C.UTF-8             "$KIRO_BIN_DIR/kiro-cli-chat" agent validate             --path "$TRUSTED_REVIEW_ROOT/.kiro/agents/pkstack-ci-reviewer.json"
          chmod -R a-w "$REVIEW_WORKSPACE"
      - name: Independent Kiro-hosted Claude Opus 5 review
        id: invoke
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          CONTENT_SHA256: ${{ needs.candidate_prepare.outputs.review_content_sha256 }}
          PATCH_SHA256: ${{ needs.candidate_prepare.outputs.review_patch_sha256 }}
        working-directory: ${{ runner.temp }}/pkstack-peer-review-workspace
        run: |
          set -euo pipefail
          stream="$REVIEW_PRIVATE/review-stream.jsonl"
          stderr="$REVIEW_PRIVATE/review.stderr"
          runtime="$REVIEW_PRIVATE/runtime"
          inventory="$REVIEW_PRIVATE/model-inventory.json"
          inventory_stderr="$REVIEW_PRIVATE/model-inventory.stderr"
          mkdir -m 0700 "$runtime"
          set +e
          env -i \
            HOME="$KIRO_USER_HOME" \
            KIRO_HOME="$KIRO_HOME" \
            PATH="$KIRO_BIN_DIR:/usr/local/bin:/usr/bin:/bin" \
            LANG=C.UTF-8 \
            CI=true \
            NO_COLOR=1 \
            KIRO_LOG_NO_COLOR=1 \
            XDG_RUNTIME_DIR="$runtime" \
            SSL_CERT_DIR=/etc/ssl/certs \
            KIRO_API_KEY="$KIRO_API_KEY" \
            timeout --signal=TERM --kill-after=5s 60s \
            "$KIRO_BIN_DIR/kiro-cli" chat --list-models --format json \
            >"$inventory" 2>"$inventory_stderr"
          inventory_rc=$?
          set -e
          test "$inventory_rc" -eq 0
          test -f "$inventory" && test ! -L "$inventory"
          test -f "$inventory_stderr" && test ! -L "$inventory_stderr"
          test "$(wc -c <"$inventory")" -le 131072
          test "$(wc -c <"$inventory_stderr")" -le 1048576
          if grep -aFq -- "$KIRO_API_KEY" "$inventory" "$inventory_stderr"; then
            echo 'Kiro model inventory contained the API key' >&2
            exit 1
          fi
          python3 "$TRUSTED_REVIEW_ROOT/.github/scripts/validate_kiro_model_inventory.py" \
            --require-review-model "$inventory"
          unlink "$inventory"
          unlink "$inventory_stderr"
          printf -v prompt \
            'Review the attached exact-candidate bundle under the immutable agent contract. Bind the verdict exactly to base %s, head %s, content SHA-256 %s, and patch SHA-256 %s. Return only the required compact JSON verdict.' \
            "$BASE_SHA" "$HEAD_SHA" "$CONTENT_SHA256" "$PATCH_SHA256"
          set +e
          env -i             HOME="$KIRO_USER_HOME"             KIRO_HOME="$KIRO_HOME"             PATH="$KIRO_BIN_DIR:/usr/local/bin:/usr/bin:/bin"             LANG=C.UTF-8             CI=true             NO_COLOR=1             KIRO_LOG_NO_COLOR=1             XDG_RUNTIME_DIR="$runtime"             SSL_CERT_DIR=/etc/ssl/certs             GIT_DIR=/dev/null             GIT_CONFIG_NOSYSTEM=1             GIT_CONFIG_SYSTEM=/dev/null             GIT_CONFIG_GLOBAL=/dev/null             GIT_ATTR_NOSYSTEM=1             GIT_EXTERNAL_DIFF=             GIT_NO_REPLACE_OBJECTS=1             GIT_TERMINAL_PROMPT=0             KIRO_API_KEY="$KIRO_API_KEY"             timeout --signal=TERM --kill-after=30s 30m             "$KIRO_BIN_DIR/kiro-cli" chat               --v3               --agent pkstack-ci-reviewer               --model "$REVIEW_MODEL"               --effort "$REVIEW_EFFORT"               --no-interactive               --trust-tools=               --output-format stream-json               "$prompt" >"$stream" 2>"$stderr"
          review_rc=$?
          set -e
          printf 'return_code=%s\n' "$review_rc" >>"$GITHUB_OUTPUT"
      - name: Validate exact no-tool approval and publish only bound hashes
        id: validate
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          CONTENT_SHA256: ${{ needs.candidate_prepare.outputs.review_content_sha256 }}
          PATCH_SHA256: ${{ needs.candidate_prepare.outputs.review_patch_sha256 }}
          REVIEW_RETURN_CODE: ${{ steps.invoke.outputs.return_code }}
          REVIEW_BUNDLE: ${{ runner.temp }}/pkstack-peer-review-workspace/.pkstack-ci/review-input.json
          SELECTED_SOURCE_ID: ${{ needs.candidate_prepare.outputs.selected_source_id }}
          SOURCE_SUBTREE_SHA: ${{ needs.candidate_prepare.outputs.source_subtree_sha }}
          SOURCE_COMMIT: ${{ needs.candidate_prepare.outputs.source_commit }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python3 "$TRUSTED_REVIEW_ROOT/.github/scripts/validate_kiro_review_stream.py" \
            --stream "$REVIEW_PRIVATE/review-stream.jsonl" \
            --stderr "$REVIEW_PRIVATE/review.stderr" \
            --bundle "$REVIEW_BUNDLE" \
            --return-code "$REVIEW_RETURN_CODE" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --content-sha256 "$CONTENT_SHA256" \
            --patch-sha256 "$PATCH_SHA256" \
            --model "$REVIEW_MODEL" \
            --effort "$REVIEW_EFFORT" \
            --github-output "$GITHUB_OUTPUT" \
            --report-path "$RUNNER_TEMP/pkstack-review-report/report.json" \
            --source-id "$SELECTED_SOURCE_ID" \
            --source-commit "$SOURCE_COMMIT" \
            --source-subtree-sha "$SOURCE_SUBTREE_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --candidate-run-id "$GITHUB_RUN_ID"
      - name: Retain bounded sanitized review report
        id: upload_report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkstack-review-report-${{ github.run_id }}
          path: ${{ runner.temp }}/pkstack-review-report/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove private Kiro review state
        if: always()
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          test "$REVIEW_PRIVATE" = "$RUNNER_TEMP/pkstack-peer-review-private"
          test "$REVIEW_WORKSPACE" = "$RUNNER_TEMP/pkstack-peer-review-workspace"
          test "$KIRO_USER_HOME" = "$RUNNER_TEMP/kiro-review-user-home"
          test "$KIRO_BIN_DIR" = "$RUNNER_TEMP/kiro-review-bin"
          test "$KIRO_HOME" = "$KIRO_USER_HOME/.kiro"
          test ! -L "$KIRO_HOME"
          if [[ -e "$KIRO_HOME" ]]; then test -d "$KIRO_HOME"; fi
          # Validate every root before removing any; .kiro is owned by its parent.
          for target in "$REVIEW_PRIVATE" "$REVIEW_WORKSPACE" "$KIRO_USER_HOME" "$KIRO_BIN_DIR"; do
            test ! -L "$target"
            if [[ -e "$target" ]]; then test -d "$target"; fi
          done
          for target in "$REVIEW_PRIVATE" "$REVIEW_WORKSPACE" "$KIRO_USER_HOME" "$KIRO_BIN_DIR"; do
            if [[ -e "$target" ]]; then
              chmod -R u+rwX "$target"
              rm -rf -- "$target"
            fi
          done

  merge:
    needs: [resolve, candidate_prepare, base_tests, candidate_tests, kiro_peer_review]
    if: >-
      needs.resolve.outputs.has_candidate == 'true'
      && needs.base_tests.result == 'success'
      && needs.candidate_tests.result == 'success'
      && needs.kiro_peer_review.result == 'success'
      && needs.kiro_peer_review.outputs.review_verdict == 'approved'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Harden merge runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            github.com:443
      - name: Check out exact trusted base controls only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Revalidate and merge only the tested SHA without candidate checkout
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          TESTED_SHA: ${{ needs.candidate_tests.outputs.tested_sha }}
          TESTED_BASE_SHA: ${{ needs.base_tests.outputs.tested_sha }}
          REVIEWED_BASE_SHA: ${{ needs.kiro_peer_review.outputs.reviewed_base_sha }}
          REVIEWED_HEAD_SHA: ${{ needs.kiro_peer_review.outputs.reviewed_head_sha }}
          REVIEWED_CONTENT_SHA256: ${{ needs.kiro_peer_review.outputs.reviewed_content_sha256 }}
          REVIEWED_PATCH_SHA256: ${{ needs.kiro_peer_review.outputs.reviewed_patch_sha256 }}
          REVIEWED_CHANGED_FILES: ${{ needs.kiro_peer_review.outputs.reviewed_changed_files }}
          REVIEWED_PATHS_SHA256: ${{ needs.kiro_peer_review.outputs.reviewed_paths_sha256 }}
          REVIEWED_AGENT: ${{ needs.kiro_peer_review.outputs.reviewed_agent }}
          REVIEWED_MODEL: ${{ needs.kiro_peer_review.outputs.reviewed_model }}
          REVIEWED_EFFORT: ${{ needs.kiro_peer_review.outputs.reviewed_effort }}
          EXPECTED_REVIEW_CONTENT_SHA256: ${{ needs.candidate_prepare.outputs.review_content_sha256 }}
          EXPECTED_REVIEW_PATCH_SHA256: ${{ needs.candidate_prepare.outputs.review_patch_sha256 }}
          EXPECTED_REVIEW_CHANGED_FILES: ${{ needs.candidate_prepare.outputs.review_changed_files }}
          EXPECTED_REVIEW_PATHS_SHA256: ${{ needs.candidate_prepare.outputs.review_paths_sha256 }}
          EXPECTED_REVIEW_AGENT: pkstack-ci-reviewer
          EXPECTED_REVIEW_MODEL: claude-opus-5
          EXPECTED_REVIEW_EFFORT: xhigh
          REVIEW_EXECUTION_EVIDENCE_SHA256: ${{ needs.kiro_peer_review.outputs.execution_evidence_sha256 }}
          REVIEW_ATTESTATION_SHA256: ${{ needs.kiro_peer_review.outputs.attestation_sha256 }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ needs.resolve.outputs.default_branch }}
          SOURCE_PROVIDER: ${{ needs.resolve.outputs.source_provider }}
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
          SOURCE_WORKFLOW: ${{ needs.resolve.outputs.source_workflow }}
          SOURCE_WORKFLOW_PATH: ${{ needs.resolve.outputs.source_workflow_path }}
          CANDIDATE_BRANCH: ${{ needs.resolve.outputs.candidate_branch }}
        with:
          script: |
            const { resolveCandidateForSource } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pkstack_pr_policy.js`
            );
            const { owner, repo } = context.repo;
            if (process.env.TESTED_BASE_SHA !== process.env.BASE_SHA) {
              core.setFailed("base regression result is not bound to the exact candidate base");
              return;
            }
            if (process.env.REVIEWED_BASE_SHA !== process.env.BASE_SHA
                || process.env.REVIEWED_HEAD_SHA !== process.env.TESTED_SHA
                || process.env.REVIEWED_CONTENT_SHA256 !== process.env.EXPECTED_REVIEW_CONTENT_SHA256
                || process.env.REVIEWED_PATCH_SHA256 !== process.env.EXPECTED_REVIEW_PATCH_SHA256
                || process.env.REVIEWED_CHANGED_FILES !== process.env.EXPECTED_REVIEW_CHANGED_FILES
                || process.env.REVIEWED_PATHS_SHA256 !== process.env.EXPECTED_REVIEW_PATHS_SHA256
                || process.env.REVIEWED_AGENT !== process.env.EXPECTED_REVIEW_AGENT
                || process.env.REVIEWED_MODEL !== process.env.EXPECTED_REVIEW_MODEL
                || process.env.REVIEWED_EFFORT !== process.env.EXPECTED_REVIEW_EFFORT) {
              core.setFailed("mandatory Kiro peer approval is not bound to the exact tested base, head, and content");
              return;
            }
            if (!/^[0-9a-f]{64}$/.test(process.env.REVIEW_EXECUTION_EVIDENCE_SHA256)
                || !/^[0-9a-f]{64}$/.test(process.env.REVIEW_ATTESTATION_SHA256)) {
              core.setFailed("Kiro review execution evidence or combined attestation digest is missing");
              return;
            }
            const policyResponse = await github.rest.repos.getContent({
              owner, repo, path: ".github/pkstack-maintenance-policy.json", ref: process.env.BASE_SHA,
            });
            if (Array.isArray(policyResponse.data) || policyResponse.data.type !== "file") {
              core.setFailed("trusted policy is unavailable at the tested base");
              return;
            }
            const policy = JSON.parse(Buffer.from(policyResponse.data.content, "base64").toString("utf8"));
            const sourceRunId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(sourceRunId)
                || sourceRunId !== context.payload.workflow_run.id) {
              core.setFailed("source run output is not bound to this workflow_run event");
              return;
            }
            const [sourceRunResponse, pulls, branchResponse] = await Promise.all([
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: sourceRunId }),
              github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                base: process.env.DEFAULT_BRANCH,
                per_page: 100,
              }),
              github.rest.repos.getBranch({
                owner, repo, branch: process.env.DEFAULT_BRANCH,
              }),
            ]);
            let eventCandidate;
            let currentCandidate;
            try {
              const common = {
                pulls,
                policy,
                baseSha: process.env.BASE_SHA,
                defaultBranch: process.env.DEFAULT_BRANCH,
                repositoryFullName: `${owner}/${repo}`,
                expectedProvider: "kiro",
              };
              eventCandidate = resolveCandidateForSource({
                ...common,
                sourceRun: context.payload.workflow_run,
              });
              currentCandidate = resolveCandidateForSource({
                ...common,
                sourceRun: sourceRunResponse.data,
              });
            } catch (error) {
              core.setFailed(error.message);
              return;
            }
            const sourceIdentities = [eventCandidate.source, currentCandidate.source];
            const boundSource = sourceIdentities.every((source) =>
              source.provider === process.env.SOURCE_PROVIDER
              && source.runIdText === process.env.SOURCE_RUN_ID
              && source.workflowName === process.env.SOURCE_WORKFLOW
              && source.workflowPath === process.env.SOURCE_WORKFLOW_PATH
              && source.expectedHeadRef === process.env.CANDIDATE_BRANCH
            );
            const pull = currentCandidate.pull;
            if (!boundSource || pull === null
                || eventCandidate.pull?.number !== pull.number
                || String(pull.number) !== process.env.PR_NUMBER) {
              core.setFailed("candidate is not bound to the exact resolved source authority");
              return;
            }
            const branch = branchResponse.data;
            const exactIdentity = pull.state === "open"
              && pull.draft === false
              && pull.title === policy.pull_request.title
              && pull.user?.login === policy.pull_request.author_login
              && pull.user?.id === policy.pull_request.author_id
              && pull.head.repo?.full_name === `${owner}/${repo}`
              && pull.head.ref === process.env.CANDIDATE_BRANCH
              && pull.head.sha === process.env.TESTED_SHA
              && pull.base.ref === process.env.DEFAULT_BRANCH
              && pull.base.sha === process.env.BASE_SHA
              && branch.commit.sha === process.env.BASE_SHA
              && (pull.labels || []).length === 0;
            if (!exactIdentity) {
              core.setFailed("PR identity, head, or base changed after testing");
              return;
            }
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${process.env.BASE_SHA}...${process.env.TESTED_SHA}`,
            })).data;
            if (comparison.status !== "ahead" || comparison.ahead_by !== 1
                || comparison.behind_by !== 0 || comparison.total_commits !== 1) {
              core.setFailed("tested SHA is no longer exactly one commit atop base");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pull.number, per_page: 100,
            });
            const exact = new Set(policy.final_allowed_exact);
            const protectedExact = new Set(policy.protected_exact);
            const allowed = (path) => exact.has(path) || Object.entries(policy.final_allowed_prefixes)
              .some(([prefix, suffixes]) => path.startsWith(prefix) && suffixes.some((suffix) => path.endsWith(suffix)));
            const protectedPath = (path) => protectedExact.has(path)
              || policy.protected_prefixes.some((prefix) => path.startsWith(prefix));
            let changedLines = 0;
            if (files.length === 0 || files.length > policy.limits.max_changed_files) {
              core.setFailed("final candidate file count is outside policy");
              return;
            }
            for (const file of files) {
              if (["renamed", "copied"].includes(file.status) || protectedPath(file.filename)
                  || !allowed(file.filename) || file.patch === undefined || file.patch === null) {
                core.setFailed(`final candidate path or patch violates policy: ${file.filename}`);
                return;
              }
              changedLines += file.additions + file.deletions;
            }
            if (changedLines > policy.limits.max_changed_lines) {
              core.setFailed("final candidate changed-line count exceeds policy");
              return;
            }
            const tree = (await github.rest.git.getTree({
              owner, repo, tree_sha: process.env.TESTED_SHA, recursive: "true",
            })).data;
            if (tree.truncated) {
              core.setFailed("final candidate tree is truncated");
              return;
            }
            const treeByPath = new Map(tree.tree.map((entry) => [entry.path, entry]));
            for (const file of files.filter((item) => item.status !== "removed")) {
              const entry = treeByPath.get(file.filename);
              const expectedMode = [".pkstack/bin/projectctl", "projectctl"].includes(file.filename) ? "100755" : "100644";
              if (!entry || entry.type !== "blob" || entry.mode !== expectedMode) {
                core.setFailed(`final candidate object or mode is invalid: ${file.filename}`);
                return;
              }
            }
            const merged = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pull.number,
              sha: process.env.TESTED_SHA,
              merge_method: "squash",
              commit_title: policy.pull_request.title,
              commit_message: `Automated merge of exact tested SHA ${process.env.TESTED_SHA}`,
            });
            if (!merged.data.merged) {
              core.setFailed(`GitHub refused exact-SHA merge: ${merged.data.message}`);
              return;
            }
            core.notice(`merged PR #${pull.number} from exact tested SHA ${process.env.TESTED_SHA}`);

  record_rejection:
    needs: [resolve, candidate_prepare, base_tests, candidate_tests, kiro_peer_review]
    if: always() && needs.candidate_tests.result == 'success' && needs.kiro_peer_review.outputs.review_verdict == 'rejected'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Harden trusted feedback publisher networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out immutable feedback controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download this workflow's validated review report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.kiro_peer_review.outputs.report_artifact_id }}
          path: ${{ runner.temp }}/pkstack-feedback-report
      - name: Read current durable feedback without candidate code
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEFAULT_BRANCH: ${{ needs.resolve.outputs.default_branch }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = (await github.rest.repos.getBranch({owner, repo, branch: process.env.DEFAULT_BRANCH})).data;
            const response = (await github.rest.repos.getContent({owner, repo,
              path: 'maintenance/upstream-feedback.json', ref: branch.commit.sha})).data;
            if (Array.isArray(response) || response.type !== 'file' || response.size > 1048576) {
              throw new Error('durable review history is missing or unbounded');
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/pkstack-feedback-current.json`,
              Buffer.from(response.content, 'base64'), {mode: 0o600});
            core.setOutput('parent_sha', branch.commit.sha);
      - name: Bind report and advance only its substantive rejection count
        env:
          REPORT_SHA256: ${{ needs.kiro_peer_review.outputs.report_sha256 }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          RETRY_OVERRIDE: ${{ needs.candidate_prepare.outputs.retry_override }}
        run: |
          python3 .github/scripts/pkstack_review_feedback.py \
            --ledger "$RUNNER_TEMP/pkstack-feedback-current.json" \
            --report "$RUNNER_TEMP/pkstack-feedback-report/report.json" \
            --expected-sha256 "$REPORT_SHA256" \
            --source-run-id "$SOURCE_RUN_ID" --candidate-run-id "$GITHUB_RUN_ID" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --retry-override "$RETRY_OVERRIDE" \
            --output "$RUNNER_TEMP/pkstack-feedback-next.json"
      - name: Commit only feedback with a compare-and-swap branch update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PARENT_SHA: ${{ steps.current.outputs.parent_sha }}
          DEFAULT_BRANCH: ${{ needs.resolve.outputs.default_branch }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const parent = (await github.rest.git.getCommit({owner, repo, commit_sha: process.env.PARENT_SHA})).data;
            const blob = (await github.rest.git.createBlob({owner, repo, encoding: 'base64',
              content: fs.readFileSync(`${process.env.RUNNER_TEMP}/pkstack-feedback-next.json`).toString('base64')})).data;
            const tree = (await github.rest.git.createTree({owner, repo, base_tree: parent.tree.sha,
              tree: [{path: 'maintenance/upstream-feedback.json', mode: '100644', type: 'blob', sha: blob.sha}]})).data;
            if (tree.sha === parent.tree.sha) { core.info('review feedback already recorded'); return; }
            const commit = (await github.rest.git.createCommit({owner, repo, tree: tree.sha,
              parents: [process.env.PARENT_SHA], message: 'chore: record bounded upstream review feedback'})).data;
            // A concurrent main commit makes this sibling non-fast-forward. Never force it.
            await github.rest.git.updateRef({owner, repo, ref: `heads/${process.env.DEFAULT_BRANCH}`,
              sha: commit.sha, force: false});

  cleanup_failed_candidate:
    needs: [resolve, candidate_prepare, base_tests, candidate_tests, kiro_peer_review, merge, record_rejection]
    if: >-
      always()
      && github.event.workflow_run.conclusion == 'success'
      && needs.merge.result != 'success'
      && (needs.candidate_tests.result != 'success' || needs.kiro_peer_review.outputs.review_verdict != 'rejected' || needs.record_rejection.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Harden API-only terminal cleanup runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            github.com:443
      - name: Check out exact trusted source controls only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Close only the exact failed candidate PR so cadence can recover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          FEEDBACK_RECORDED: ${{ needs.record_rejection.result == 'success' }}
        with:
          script: |
            const { authorizeTerminalCandidateClose } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pkstack_pr_policy.js`
            );
            const { owner, repo } = context.repo;
            const repository = (await github.rest.repos.get({ owner, repo })).data;
            const policyResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/pkstack-maintenance-policy.json",
              ref: process.env.SOURCE_SHA,
            });
            if (Array.isArray(policyResponse.data) || policyResponse.data.type !== "file") {
              core.setFailed("trusted maintenance policy is unavailable at the source SHA");
              return;
            }
            const policy = JSON.parse(
              Buffer.from(policyResponse.data.content, "base64").toString("utf8")
            );
            const sourceRunId = Number(process.env.SOURCE_RUN_ID);
            const candidateRunId = Number(process.env.CANDIDATE_RUN_ID);
            if (!Number.isSafeInteger(sourceRunId) || !Number.isSafeInteger(candidateRunId)) {
              core.setFailed("workflow run identity exceeds JavaScript precision");
              return;
            }
            const [sourceRunResponse, candidateRunResponse, pulls] = await Promise.all([
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: sourceRunId }),
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: candidateRunId }),
              github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                base: repository.default_branch,
                per_page: 100,
              }),
            ]);
            let decision;
            try {
              decision = await authorizeTerminalCandidateClose({
                allowFeedbackAdvance: process.env.FEEDBACK_RECORDED === 'true',
                pulls,
                policy,
                baseSha: process.env.SOURCE_SHA,
                defaultBranch: repository.default_branch,
                repositoryFullName: `${owner}/${repo}`,
                sourceRun: sourceRunResponse.data,
                candidateRun: candidateRunResponse.data,
                loadCommit: async (sha) => (await github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: sha,
                })).data,
              });
            } catch (error) {
              core.setFailed(error.message);
              return;
            }
            if (decision.action === "none") {
              core.info("no exact open candidate remains for terminal cleanup");
              return;
            }
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: decision.prNumber,
              state: "closed",
            });
            core.warning(
              `closed failed exact candidate PR #${decision.prNumber} at ${decision.headSha}; `
              + `future scheduled maintenance may retry from a fresh source run`
            );
