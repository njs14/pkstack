name: PKStack Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: pkstack-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_run_id: ${{ steps.package.outputs.source_run_id }}
      source_run_attempt: ${{ steps.package.outputs.source_run_attempt }}
      artifact_id: ${{ steps.package.outputs.artifact_id }}
      artifact_digest: ${{ steps.package.outputs.artifact_digest }}
      publication_eligible: ${{ steps.package.outputs.publication_eligible }}
    steps:
      - name: Harden read-only release verification networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            github.com:443
            *.blob.core.windows.net:443
      - name: Check out the exact release tag without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact-main CI package and live release identity
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "refs/tags/$EXPECTED_TAG"
          python3 -B .github/scripts/pkstack_ci_package.py verify \
            --repo-root . --output-dir "$RUNNER_TEMP/pkstack-release-verified" \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --sha "$RELEASE_SHA" --tag "$EXPECTED_TAG" \
            --github-output "$GITHUB_OUTPUT"

  publish:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.publication_eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Harden publication runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            github.com:443
            uploads.github.com:443
            *.blob.core.windows.net:443
      - name: Check out the exact trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Reverify the same artifact and publish its unchanged archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ needs.verify.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.verify.outputs.source_run_attempt }}
          PACKAGE_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          umask 077
          test "$RELEASE_REF" = "refs/tags/$EXPECTED_TAG"
          verified="$RUNNER_TEMP/pkstack-release-publish"
          python3 -B .github/scripts/pkstack_ci_package.py verify \
            --repo-root . --output-dir "$verified" \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --sha "$RELEASE_SHA" --tag "$EXPECTED_TAG" \
            --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --artifact-id "$PACKAGE_ARTIFACT_ID" --artifact-digest "$PACKAGE_ARTIFACT_DIGEST"
          archive="pkstack-${EXPECTED_TAG}.tar.gz"
          install -m 0600 "$verified/package.tar.gz" "$verified/$archive"
          (
            cd "$verified"
            sha256sum --check package.tar.gz.sha256
            cmp package.tar.gz "$archive"
            sha256sum "$archive" >"$archive.sha256"
            sha256sum --check "$archive.sha256"
          )
          gh release create "$EXPECTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PKStack $EXPECTED_TAG" \
            --notes-file "$verified/notes.md" \
            "$verified/$archive" "$verified/$archive.sha256"
