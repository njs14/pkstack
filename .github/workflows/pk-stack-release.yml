name: PKStack Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: pkstack-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EXPECTED_TAG: ${{ github.ref_name }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PYTHONDONTWRITEBYTECODE: "1"
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Harden release runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            uploads.github.com:443
      - name: Check out the exact release tag without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify private repository, tag identity, and package metadata
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$REPOSITORY_PRIVATE" = "true"
          test "$RELEASE_REF" = "refs/tags/$EXPECTED_TAG"
          test "$RELEASE_REF_NAME" = "$EXPECTED_TAG"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse --verify "$EXPECTED_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git describe --exact-match --tags "$RELEASE_SHA")" = "$EXPECTED_TAG"
          test "$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")" = "$RELEASE_SHA"
          python3 - "$EXPECTED_TAG" <<'PY'
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          tag = sys.argv[1]
          expected = tag.removeprefix("v")
          power = Path("powers/pkstack")
          pyproject = tomllib.loads((power / "pyproject.toml").read_text(encoding="utf-8"))
          manifest = json.loads((power / "plugin.json").read_text(encoding="utf-8"))
          source = (power / "src/pkstack/__init__.py").read_text(encoding="utf-8")
          version = pyproject["project"].get("version")
          runtime = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE)
          if version != expected or manifest.get("version") != expected:
              raise SystemExit("tag does not match package and plugin versions")
          if runtime is None or runtime.group(1) != expected:
              raise SystemExit("tag does not match the Power runtime version")
          PY
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: powers/pkstack/uv.lock
      - name: Re-run deterministic release gates on the tagged commit
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test .github/scripts/test_pkstack_pr_policy.js
          uv sync --quiet --locked --all-groups --project powers/pkstack
          (
            cd powers/pkstack
            uv lock --check
            uv run --frozen ruff check src tests skills/pkstack-setup/scripts/setup_pkstack.py
            uv run --frozen ruff format --check src tests skills/pkstack-setup/scripts/setup_pkstack.py
            uv run --frozen ty check
            uv run --frozen pytest -q
          )
          ./.pkstack/bin/projectctl version --output json
          ./.pkstack/bin/projectctl feature validate --output json
          ./.pkstack/bin/projectctl knowledge validate --output json
      - name: Build deterministic PKStack Power archive and SHA-256
        run: |
          set -euo pipefail
          RELEASE_VERSION=${EXPECTED_TAG#v}
          umask 077
          ARCHIVE_DIR="$RUNNER_TEMP/pkstack-release"
          test ! -e "$ARCHIVE_DIR"
          mkdir -m 0700 "$ARCHIVE_DIR"
          raw_archive="$ARCHIVE_DIR/pkstack-v${RELEASE_VERSION}.tar"
          archive="$ARCHIVE_DIR/pkstack-v${RELEASE_VERSION}.tar.gz"
          checksum="$ARCHIVE_DIR/pkstack-v${RELEASE_VERSION}.tar.gz.sha256"
          # A subtree expression loses Git's automatic commit-time selection.
          release_timestamp=$(git show -s --format=%ct "$RELEASE_SHA")
          git archive --format=tar --prefix=pkstack/ \
            --mtime="@$release_timestamp" \
            --output "$raw_archive" \
            "$RELEASE_SHA:powers/pkstack"
          gzip --no-name --stdout "$raw_archive" >"$archive"
          (
            cd "$ARCHIVE_DIR"
            sha256sum "$(basename "$archive")" >"$(basename "$checksum")"
            sha256sum --check "$(basename "$checksum")"
          )
          test -s "$archive"
          test -s "$checksum"
          printf 'ARCHIVE=%s\n' "$archive" >>"$GITHUB_ENV"
          printf 'CHECKSUM=%s\n' "$checksum" >>"$GITHUB_ENV"
      - name: Create the private GitHub Release with the repository token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$EXPECTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PKStack $EXPECTED_TAG" \
            --notes "PKStack $EXPECTED_TAG Power archive. The repository is private; assets are published only to its private GitHub Release." \
            "$ARCHIVE" "$CHECKSUM"
