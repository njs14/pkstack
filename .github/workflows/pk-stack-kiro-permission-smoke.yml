name: PK-Stack Kiro Permission Smoke

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pk-stack-kiro-permission-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  permission-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner networking
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            api.github.com:443
            app.kiro.dev:443
            assets.app.kiro.dev:443
            cli.kiro.dev:443
            desktop-release.q.us-east-1.amazonaws.com:443
            github.com:443
            management.eu-central-1.kiro.dev:443
            management.us-east-1.kiro.dev:443
            objects.githubusercontent.com:443
            prod.download.cli.kiro.dev:443
            prod.download.desktop.kiro.dev:443
            prod.us-east-1.auth.desktop.kiro.dev:443
            prod.us-east-1.telemetry.desktop.kiro.dev:443
            q.eu-central-1.amazonaws.com:443
            q.us-east-1.amazonaws.com:443
            results-receiver.actions.githubusercontent.com:443
            runtime.eu-central-1.kiro.dev:443
            runtime.us-east-1.kiro.dev:443
            telemetry.eu-central-1.kiro.dev:443
            telemetry.us-east-1.kiro.dev:443
      - name: Check out immutable permission fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare checksum-pinned sterile Kiro permission runtime
        env:
          SMOKE_ROOT: ${{ runner.temp }}/pk-stack-kiro-permission-smoke
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$SMOKE_ROOT"
          workspace_template="$SMOKE_ROOT/template/workspace"
          mkdir -p \
            "$SMOKE_ROOT/bin" \
            "$SMOKE_ROOT/cases" \
            "$SMOKE_ROOT/settings-template/settings" \
            "$workspace_template/.github" \
            "$workspace_template/.kiro/agents" \
            "$workspace_template/.pk-stack-maintenance" \
            "$workspace_template/maintenance" \
            "$workspace_template/powers/pk-stack/dev.kiro/steering" \
            "$workspace_template/powers/pk-stack/docs/smoke" \
            "$workspace_template/powers/pk-stack/skills/permission-smoke" \
            "$workspace_template/powers/pk-stack/src/pstack_kiro" \
            "$workspace_template/powers/pk-stack/templates/project/.kiro/agents" \
            "$workspace_template/powers/pk-stack/tests"
          archive="$SMOKE_ROOT/kirocli-2.21.0.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$archive" \
            https://prod.download.cli.kiro.dev/stable/2.21.0/kirocli-x86_64-linux.tar.xz
          printf '%s  %s\n' \
            6eccb46617a84690fc892219f264f7617312761c9a3d7e38cc47a0e2ab0152b7 \
            "$archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$SMOKE_ROOT/bin" \
            --strip-components=2 \
            kirocli/bin/kiro-cli \
            kirocli/bin/kiro-cli-chat
          test "$("$SMOKE_ROOT/bin/kiro-cli" --version)" = "kiro-cli 2.21.0"
          install -m 0600 \
            .github/fixtures/kiro-permission-agent.json \
            "$workspace_template/.kiro/agents/pk-stack-permission-fixture.json"
          install -m 0500 \
            .github/scripts/validate_kiro_permission_stream.py \
            "$SMOKE_ROOT/validate-stream.py"
          printf '%s  %s\n' \
            3e9e9b4090ad8fb20a2b05ec07a206cbf2ef56542c0448fb880e001629130de7 \
            "$workspace_template/.kiro/agents/pk-stack-permission-fixture.json" \
            | sha256sum --check
          printf '%s  %s\n' \
            82d9ae9ee035c9c86ec0e07589483a1bfc6d5141234472ca0937044f612bf972 \
            "$SMOKE_ROOT/validate-stream.py" | sha256sum --check
          python3 - "$workspace_template/.kiro/agents/pk-stack-permission-fixture.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          fixture = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          production = json.loads(
              Path(".kiro/agents/pstack-maintainer.json").read_text(encoding="utf-8")
          )
          policy = json.loads(
              Path(".github/pk-stack-maintenance-policy.json").read_text(encoding="utf-8")
          )
          authority = policy["ci_authority"]
          expected = [
              {"capability": "fs_read", "match": ["./**"], "effect": "allow"},
              {"capability": "grep", "match": ["./**"], "effect": "allow"},
              {
                  "capability": "fs_write",
                  "match": authority["write_patterns"],
                  "effect": "allow",
              },
              {
                  "capability": "fs_write",
                  "match": authority["deny_patterns"],
                  "effect": "deny",
              },
          ]
          fixture_permissions = fixture.get("permissions")
          production_permissions = production.get("permissions")
          if not isinstance(fixture_permissions, dict) or set(fixture_permissions) != {"rules"}:
              raise SystemExit("permission fixture must contain only permissions.rules")
          if fixture_permissions["rules"] != expected:
              raise SystemExit("permission fixture rules differ from immutable policy")
          if production_permissions != fixture_permissions:
              raise SystemExit("permission fixture rules differ from production maintainer")
          if fixture.get("toolsSettings") != authority["tools_settings"]:
              raise SystemExit("permission fixture lacks immutable V3 discovery settings")
          if production.get("toolsSettings") != fixture["toolsSettings"]:
              raise SystemExit("permission fixture discovery settings differ from production")
          PY
          printf '%s\n' 'ALPHA_TOKEN sterile permission input' \
            >"$workspace_template/fixture-input.txt"
          protected_paths=(
            .github/protected.txt
            .kiro/protected.txt
            powers/pk-stack/src/pstack_kiro/protected.py
            powers/pk-stack/tests/protected.py
            maintenance/upstream-reviews.json
            powers/pk-stack/docs/validation-report.md
          )
          for protected_path in "${protected_paths[@]}"; do
            printf 'PROTECTED_BASELINE %s\n' "$protected_path" \
              >"$workspace_template/$protected_path"
          done
          (
            cd "$workspace_template"
            if find . ! -type d ! -type f -print -quit | grep -q .; then
              exit 1
            fi
            find . -type f -printf '%P\n' | LC_ALL=C sort \
              >"$SMOKE_ROOT/template-files.txt"
            find . -type d -printf '%P\n' | LC_ALL=C sort \
              >"$SMOKE_ROOT/template-directories.txt"
            while IFS= read -r template_file; do
              test -n "$template_file"
              sha256sum -- "$template_file"
            done <"$SMOKE_ROOT/template-files.txt" \
              >"$SMOKE_ROOT/template-baseline.sha256"
          )
          cat >"$SMOKE_ROOT/allowed-files.txt" <<'EOF'
          .github/protected.txt
          .kiro/agents/pk-stack-permission-fixture.json
          .kiro/protected.txt
          .pk-stack-maintenance/proposal.json
          fixture-input.txt
          maintenance/upstream-reviews.json
          powers/pk-stack/README.md
          powers/pk-stack/dev.kiro/steering/permission-smoke.md
          powers/pk-stack/docs/smoke/permission.md
          powers/pk-stack/docs/upstream-skill-parity.json
          powers/pk-stack/docs/validation-report.md
          powers/pk-stack/skills/permission-smoke/SKILL.md
          powers/pk-stack/src/pstack_kiro/protected.py
          powers/pk-stack/templates/project/.kiro/agents/permission-smoke.json
          powers/pk-stack/tests/protected.py
          EOF
          settings_path="$SMOKE_ROOT/settings-template/settings/cli.json"
          install -m 0600 /dev/null "$settings_path"
          printf '%s\n' \
            '{' \
            '  "app.disableAutoupdates": true,' \
            '  "chat.disableInheritingDefaultResources": true,' \
            '  "telemetry.enabled": false' \
            '}' >"$settings_path"
          printf '%s  %s\n' \
            81d98ac813691c26f18f797ca5126c5150125cf74d2f6d413e152290074a6bd0 \
            "$settings_path" | sha256sum --check
          test "$(stat -c '%a' "$settings_path")" = 600
          test ! -e "$SMOKE_ROOT/settings-template/settings/mcp.json"
          chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Invoke isolated production permission cases
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          SMOKE_ROOT: ${{ runner.temp }}/pk-stack-kiro-permission-smoke
        run: |
          set -euo pipefail
          umask 077
          : "${KIRO_API_KEY:?KIRO_API_KEY is not configured}"

          prepare_case() {
            local case_id="$1"
            local case_root="$SMOKE_ROOT/cases/$case_id"
            test ! -e "$case_root"
            mkdir -p \
              "$case_root/workspace" \
              "$case_root/user-home" \
              "$case_root/kiro-home/settings" \
              "$case_root/runtime" \
              "$case_root/logs"
            chmod 0700 \
              "$case_root" \
              "$case_root/workspace" \
              "$case_root/user-home" \
              "$case_root/kiro-home" \
              "$case_root/kiro-home/settings" \
              "$case_root/runtime" \
              "$case_root/logs"
            cp -R "$SMOKE_ROOT/template/workspace/." "$case_root/workspace/"
            install -m 0600 \
              "$SMOKE_ROOT/settings-template/settings/cli.json" \
              "$case_root/kiro-home/settings/cli.json"
            if find "$case_root" ! -type d ! -type f -print -quit | grep -q .; then
              exit 1
            fi
            test ! -e "$case_root/user-home/.kiro"
            test ! -e "$case_root/kiro-home/settings/mcp.json"
            printf '%s  %s\n' \
              3e9e9b4090ad8fb20a2b05ec07a206cbf2ef56542c0448fb880e001629130de7 \
              "$case_root/workspace/.kiro/agents/pk-stack-permission-fixture.json" \
              | sha256sum --check
          }

          check_auxiliary_logs() {
            local validate_log="$1"
            local agent_list_log="$2"
            python3 - "$validate_log" "$agent_list_log" <<'PY'
          import os
          import sys
          from pathlib import Path

          api_key = os.environ.get("KIRO_API_KEY", "").encode("utf-8")
          if not api_key:
              raise SystemExit("KIRO_API_KEY is empty")
          for raw_path in sys.argv[1:]:
              path = Path(raw_path)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("Kiro auxiliary output is not a regular file")
              raw = path.read_bytes()
              if len(raw) > 4 * 1024 * 1024:
                  raise SystemExit("Kiro auxiliary output exceeded 4 MiB")
              if api_key in raw:
                  raise SystemExit("Kiro auxiliary output contained the API key")
              if b'not found, using "default"' in raw:
                  raise SystemExit("Kiro auxiliary command fell back to default")
          PY
          }

          verify_template_case() {
            local case_root="$1"
            (
              cd "$case_root/workspace"
              if find . ! -type d ! -type f -print -quit | grep -q .; then
                exit 1
              fi
              sha256sum --check "$SMOKE_ROOT/template-baseline.sha256"
              find . -type f -printf '%P\n' | LC_ALL=C sort \
                >"$case_root/logs/actual-files.txt"
              find . -type d -printf '%P\n' | LC_ALL=C sort \
                >"$case_root/logs/actual-directories.txt"
            )
            cmp "$SMOKE_ROOT/template-files.txt" "$case_root/logs/actual-files.txt"
            cmp \
              "$SMOKE_ROOT/template-directories.txt" \
              "$case_root/logs/actual-directories.txt"
          }

          run_case() {
            local case_id="$1"
            local timeout_seconds="$2"
            local kind="$3"
            local prompt="$4"
            local resource="${5:-}"
            local case_root="$SMOKE_ROOT/cases/$case_id"
            local workspace="$case_root/workspace"
            local agent="$workspace/.kiro/agents/pk-stack-permission-fixture.json"
            local validate_log="$case_root/logs/agent-validate.log"
            local agent_list_log="$case_root/logs/agent-list.log"
            local stream="$case_root/logs/stream.jsonl"
            local stderr="$case_root/logs/stderr.log"

            prepare_case "$case_id"
            (
              cd "$workspace"
              env -i \
                HOME="$case_root/user-home" \
                KIRO_HOME="$case_root/kiro-home" \
                PATH="$SMOKE_ROOT/bin:/usr/local/bin:/usr/bin:/bin" \
                LANG=C.UTF-8 \
                CI=true \
                NO_COLOR=1 \
                KIRO_LOG_NO_COLOR=1 \
                XDG_RUNTIME_DIR="$case_root/runtime" \
                SSL_CERT_DIR=/etc/ssl/certs \
                KIRO_API_KEY="$KIRO_API_KEY" \
                timeout --signal=TERM --kill-after=5s 30s \
                "$SMOKE_ROOT/bin/kiro-cli" agent validate --path "$agent"
            ) >"$validate_log" 2>&1
            (
              cd "$workspace"
              env -i \
                HOME="$case_root/user-home" \
                KIRO_HOME="$case_root/kiro-home" \
                PATH="$SMOKE_ROOT/bin:/usr/local/bin:/usr/bin:/bin" \
                LANG=C.UTF-8 \
                CI=true \
                NO_COLOR=1 \
                KIRO_LOG_NO_COLOR=1 \
                XDG_RUNTIME_DIR="$case_root/runtime" \
                SSL_CERT_DIR=/etc/ssl/certs \
                KIRO_API_KEY="$KIRO_API_KEY" \
                timeout --signal=TERM --kill-after=5s 30s \
                "$SMOKE_ROOT/bin/kiro-cli" agent list
            ) >"$agent_list_log" 2>&1
            grep -Eq '(^|[[:space:]])pk-stack-permission-fixture([[:space:]]|$)' \
              "$agent_list_log"
            check_auxiliary_logs "$validate_log" "$agent_list_log"

            set +e
            (
              cd "$workspace"
              env -i \
                HOME="$case_root/user-home" \
                KIRO_HOME="$case_root/kiro-home" \
                PATH="$SMOKE_ROOT/bin:/usr/local/bin:/usr/bin:/bin" \
                LANG=C.UTF-8 \
                CI=true \
                NO_COLOR=1 \
                KIRO_LOG_NO_COLOR=1 \
                XDG_RUNTIME_DIR="$case_root/runtime" \
                SSL_CERT_DIR=/etc/ssl/certs \
                KIRO_API_KEY="$KIRO_API_KEY" \
                timeout --signal=TERM --kill-after=5s "${timeout_seconds}s" \
                "$SMOKE_ROOT/bin/kiro-cli" chat \
                  --v3 \
                  --agent pk-stack-permission-fixture \
                  --model gpt-5.6-sol \
                  --effort max \
                  --no-interactive \
                  --trust-tools=fs_read,fs_write,grep \
                  --output-format stream-json \
                  "$prompt"
            ) >"$stream" 2>"$stderr"
            local kiro_rc=$?
            set -e
            chmod 0600 "$stream" "$stderr"

            if [[ "$kind" == allowed ]]; then
              KIRO_API_KEY="$KIRO_API_KEY" "$SMOKE_ROOT/validate-stream.py" \
                --kind allowed \
                --stream "$stream" \
                --stderr "$stderr" \
                --return-code "$kiro_rc" \
                --workspace "$workspace"
            else
              KIRO_API_KEY="$KIRO_API_KEY" "$SMOKE_ROOT/validate-stream.py" \
                --kind denied \
                --stream "$stream" \
                --stderr "$stderr" \
                --return-code "$kiro_rc" \
                --workspace "$workspace" \
                --agent "$agent" \
                --resource "$resource"
            fi
          }

          allowed_prompt='Perform exactly these nine filesystem operations in order. Use Read File exactly once with path exactly fixture-input.txt, offset exactly 0, and limit exactly 2000. Then use Grep Search exactly once with include pattern exactly fixture-input.txt, query exactly ALPHA_TOKEN, and case-sensitive matching. Then use Write File once for each path and exact UTF-8 content, including the final newline: .pk-stack-maintenance/proposal.json gets {"permission_smoke":true}; powers/pk-stack/README.md gets AUTHORED_README_OK; powers/pk-stack/dev.kiro/steering/permission-smoke.md gets AUTHORED_STEERING_OK; powers/pk-stack/docs/upstream-skill-parity.json gets {"permission_smoke":true}; powers/pk-stack/docs/smoke/permission.md gets AUTHORED_DOCS_OK; powers/pk-stack/skills/permission-smoke/SKILL.md gets AUTHORED_SKILL_OK; powers/pk-stack/templates/project/.kiro/agents/permission-smoke.json gets {"permission_smoke":true}. Do not perform any other operation and emit no prose.'
          run_case allowed 180 allowed "$allowed_prompt"
          allowed_root="$SMOKE_ROOT/cases/allowed"
          printf '{"permission_smoke":true}\n' \
            | cmp - "$allowed_root/workspace/.pk-stack-maintenance/proposal.json"
          printf 'AUTHORED_README_OK\n' \
            | cmp - "$allowed_root/workspace/powers/pk-stack/README.md"
          printf 'AUTHORED_STEERING_OK\n' \
            | cmp - "$allowed_root/workspace/powers/pk-stack/dev.kiro/steering/permission-smoke.md"
          printf '{"permission_smoke":true}\n' \
            | cmp - "$allowed_root/workspace/powers/pk-stack/docs/upstream-skill-parity.json"
          printf 'AUTHORED_DOCS_OK\n' \
            | cmp - "$allowed_root/workspace/powers/pk-stack/docs/smoke/permission.md"
          printf 'AUTHORED_SKILL_OK\n' \
            | cmp - "$allowed_root/workspace/powers/pk-stack/skills/permission-smoke/SKILL.md"
          printf '{"permission_smoke":true}\n' \
            | cmp - "$allowed_root/workspace/powers/pk-stack/templates/project/.kiro/agents/permission-smoke.json"
          (
            cd "$allowed_root/workspace"
            if find . ! -type d ! -type f -print -quit | grep -q .; then
              exit 1
            fi
            sha256sum --check "$SMOKE_ROOT/template-baseline.sha256"
            find . -type f -printf '%P\n' | LC_ALL=C sort \
              >"$allowed_root/logs/actual-files.txt"
            find . -type d -printf '%P\n' | LC_ALL=C sort \
              >"$allowed_root/logs/actual-directories.txt"
          )
          cmp "$SMOKE_ROOT/allowed-files.txt" "$allowed_root/logs/actual-files.txt"
          cmp \
            "$SMOKE_ROOT/template-directories.txt" \
            "$allowed_root/logs/actual-directories.txt"

          denied_resources=(
            .github/protected.txt
            .kiro/protected.txt
            powers/pk-stack/src/pstack_kiro/protected.py
            powers/pk-stack/tests/protected.py
            maintenance/upstream-reviews.json
            powers/pk-stack/docs/validation-report.md
          )
          case_number=0
          for resource in "${denied_resources[@]}"; do
            case_number=$((case_number + 1))
            printf -v case_id 'deny-%02d' "$case_number"
            printf -v denied_prompt \
              'Attempt exactly one Write File operation: replace %s with exact UTF-8 content BLOCKED followed by one newline. Do not perform any other operation, do not retry after denial, and emit no prose.' \
              "$resource"
            run_case "$case_id" 120 denied "$denied_prompt" "$resource"
            verify_template_case "$SMOKE_ROOT/cases/$case_id"
          done

          (
            cd "$SMOKE_ROOT/template/workspace"
            if find . ! -type d ! -type f -print -quit | grep -q .; then
              exit 1
            fi
            sha256sum --check "$SMOKE_ROOT/template-baseline.sha256"
            find . -type d -printf '%P\n' | LC_ALL=C sort \
              >"$SMOKE_ROOT/template-directories-final.txt"
          )
          cmp \
            "$SMOKE_ROOT/template-directories.txt" \
            "$SMOKE_ROOT/template-directories-final.txt"
          printf '%s  %s\n' \
            81d98ac813691c26f18f797ca5126c5150125cf74d2f6d413e152290074a6bd0 \
            "$SMOKE_ROOT/settings-template/settings/cli.json" | sha256sum --check
          printf '%s\n' \
            'Kiro honored seven allowed writes and six isolated denials from the production maintainer matrix.'
      - name: Delete every disposable Kiro permission artifact
        if: always()
        env:
          SMOKE_ROOT: ${{ runner.temp }}/pk-stack-kiro-permission-smoke
        run: |
          set -euo pipefail
          case "$SMOKE_ROOT" in
            "$RUNNER_TEMP"/pk-stack-kiro-permission-smoke) ;;
            *) exit 1 ;;
          esac
          if [ -e "$SMOKE_ROOT" ] || [ -L "$SMOKE_ROOT" ]; then
            test -d "$SMOKE_ROOT"
            test ! -L "$SMOKE_ROOT"
            test -O "$SMOKE_ROOT"
            chmod -R u+rwX "$SMOKE_ROOT"
            rm -rf -- "$SMOKE_ROOT"
          fi
          test ! -e "$SMOKE_ROOT"
          test ! -L "$SMOKE_ROOT"
