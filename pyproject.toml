[project]
name = "pkstack-development"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pkstack"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.14",
  "ty>=0.0.1a20,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
pkstack = { path = "powers/pkstack", editable = true }
