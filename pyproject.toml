[project]
name = "pkstack-development"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pkstack"]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16.6,<1",
  "ty>=0.0.80,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
pkstack = { path = "powers/pkstack", editable = true }
