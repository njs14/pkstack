[project]
name = "pk-stack-lab"
version = "0.1.0"
description = "A safe, Docker-backed Floci ECS integration laboratory"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2"]

[project.scripts]
pk-stack-lab = "pk_stack_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".pstack", ".kiro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
