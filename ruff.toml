# Repository development configuration; the distributed Power has no lint config.
target-version = "py311"
line-length = 100
src = ["powers/pkstack/src"]

extend-exclude = [
  # Regenerated by a reviewed `/pkstack-setup` run; edits belong in
  # `powers/pkstack/` and are copied here verbatim.
  ".kiro",
  ".pkstack",
  # Historical review evidence, including fixtures that fail on purpose.
  "reviews",
  "tests/fixtures/generated",
]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[lint.per-file-ignores]
# Workflow steps launch this entrypoint with the runner's system `python3`,
# before any uv-managed interpreter exists, so its pre-3.11 guard has to stay
# even though the lint target version is 3.11.
".github/scripts/pkstack_ci_package.py" = ["UP036"]
"powers/pkstack/skills/pkstack-setup/scripts/setup_pkstack.py" = ["UP036"]

[format]
quote-style = "double"
