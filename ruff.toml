# Lint and format settings for maintained first-party Python outside the Power
# project. Ruff resolves configuration per file, so anything under
# `powers/pkstack/` keeps using the `[tool.ruff]` section of its own
# `pyproject.toml`; this file covers the repository-root surfaces, chiefly
# `.github/scripts/`.
target-version = "py311"
line-length = 100

extend-exclude = [
  # Regenerated by a reviewed `/pkstack-setup` run; edits belong in
  # `powers/pkstack/` and are copied here verbatim.
  ".kiro",
  ".pkstack",
  # Historical review evidence, including fixtures that fail on purpose.
  "reviews",
]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[lint.per-file-ignores]
# Workflow steps launch this entrypoint with the runner's system `python3`,
# before any uv-managed interpreter exists, so its pre-3.11 guard has to stay
# even though the lint target version is 3.11.
".github/scripts/pkstack_ci_package.py" = ["UP036"]

[format]
quote-style = "double"
