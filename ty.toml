# Repository development configuration for all maintained first-party Python.

[environment]
python-version = "3.11"
# Workflow scripts are executed as `python3 -B .github/scripts/<name>.py` and
# import each other by module name, so that directory is the first-party root.
root = [".github/scripts", "tests", "benchmarks", "powers/pkstack/src", "powers/pkstack/examples/verified-goal-demo"]

[src]
include = [".github/scripts", "tests", "benchmarks", "powers/pkstack/src", "powers/pkstack/examples", "powers/pkstack/skills/pkstack-setup/scripts"]

[terminal]
error-on-warning = true
