# Optional user policy for ~/.kiro/settings/permissions.yaml.
# Install manually after reviewing docs/permissions.md. PKStack setup never copies this file.
# Builtin excludes MCP. Existing user/workspace asks and denies still win.
rules:
  - capability: builtin
    effect: allow

  # Direct root/home operands only: ordinary recursive cleanup remains allowed.
  # Shell patterns match source text, not resolved paths or arbitrary script behavior.
  - capability: shell
    effect: deny
    match:
      - "rm * /"
      - "rm / *"
      - "rm * / *"
      - "rm * \"/\""
      - "rm \"/\" *"
      - "rm * \"/\" *"
      - "rm * ~"
      - "rm ~ *"
      - "rm * ~ *"
      - "rm * ~/"
      - "rm ~/ *"
      - "rm * ~/ *"
      - "rm * \"$HOME\""
      - "rm \"$HOME\" *"
      - "rm * \"$HOME\" *"
      - "rm * \"${HOME}\""
      - "rm \"${HOME}\" *"
      - "rm * \"${HOME}\" *"
      - "*/rm * /"
      - "*/rm / *"
      - "*/rm * / *"
      - "*/rm * \"/\""
      - "*/rm \"/\" *"
      - "*/rm * \"/\" *"
      - "*/rm * ~"
      - "*/rm ~ *"
      - "*/rm * ~ *"
      - "*/rm * ~/"
      - "*/rm ~/ *"
      - "*/rm * ~/ *"
      - "*/rm * \"$HOME\""
      - "*/rm \"$HOME\" *"
      - "*/rm * \"$HOME\" *"
      - "*/rm * \"${HOME}\""
      - "*/rm \"${HOME}\" *"
      - "*/rm * \"${HOME}\" *"
      - "sudo rm * /"
      - "sudo rm / *"
      - "sudo rm * / *"
      - "sudo rm * \"/\""
      - "sudo rm \"/\" *"
      - "sudo rm * \"/\" *"
      - "sudo rm * ~"
      - "sudo rm ~ *"
      - "sudo rm * ~ *"
      - "sudo rm * ~/"
      - "sudo rm ~/ *"
      - "sudo rm * ~/ *"
      - "sudo rm * \"$HOME\""
      - "sudo rm \"$HOME\" *"
      - "sudo rm * \"$HOME\" *"
      - "sudo rm * \"${HOME}\""
      - "sudo rm \"${HOME}\" *"
      - "sudo rm * \"${HOME}\" *"
      - "sudo */rm * /"
      - "sudo */rm / *"
      - "sudo */rm * / *"
      - "sudo */rm * \"/\""
      - "sudo */rm \"/\" *"
      - "sudo */rm * \"/\" *"
      - "sudo */rm * ~"
      - "sudo */rm ~ *"
      - "sudo */rm * ~ *"
      - "sudo */rm * ~/"
      - "sudo */rm ~/ *"
      - "sudo */rm * ~/ *"
      - "sudo */rm * \"$HOME\""
      - "sudo */rm \"$HOME\" *"
      - "sudo */rm * \"$HOME\" *"
      - "sudo */rm * \"${HOME}\""
      - "sudo */rm \"${HOME}\" *"
      - "sudo */rm * \"${HOME}\" *"

  # Filesystem formatting and macOS disk erasure.
  - capability: shell
    effect: deny
    match:
      - "mkfs *"
      - "mkfs.*"
      - "*/mkfs *"
      - "*/mkfs.*"
      - "sudo mkfs *"
      - "sudo mkfs.*"
      - "sudo */mkfs *"
      - "sudo */mkfs.*"
      - "diskutil erase*"
      - "diskutil zeroDisk*"
      - "diskutil randomDisk*"
      - "diskutil secureErase*"
      - "diskutil partitionDisk*"
      - "*/diskutil erase*"
      - "*/diskutil zeroDisk*"
      - "*/diskutil randomDisk*"
      - "*/diskutil secureErase*"
      - "*/diskutil partitionDisk*"
      - "sudo diskutil erase*"
      - "sudo diskutil zeroDisk*"
      - "sudo diskutil randomDisk*"
      - "sudo diskutil secureErase*"
      - "sudo diskutil partitionDisk*"

  # Common macOS/Linux block devices; null/stdout/stderr are not disk targets.
  - capability: shell
    effect: deny
    match:
      - "dd *of=/dev/disk*"
      - "dd *of=/dev/rdisk*"
      - "dd *of=/dev/sd*"
      - "dd *of=/dev/hd*"
      - "dd *of=/dev/vd*"
      - "dd *of=/dev/xvd*"
      - "dd *of=/dev/nvme*"
      - "dd *of=/dev/mmcblk*"
      - "dd *of=/dev/mapper/*"
      - "*/dd *of=/dev/disk*"
      - "*/dd *of=/dev/rdisk*"
      - "*/dd *of=/dev/sd*"
      - "*/dd *of=/dev/hd*"
      - "*/dd *of=/dev/vd*"
      - "*/dd *of=/dev/xvd*"
      - "*/dd *of=/dev/nvme*"
      - "*/dd *of=/dev/mmcblk*"
      - "*/dd *of=/dev/mapper/*"
      - "sudo dd *of=/dev/disk*"
      - "sudo dd *of=/dev/rdisk*"
      - "sudo dd *of=/dev/sd*"
      - "sudo dd *of=/dev/hd*"
      - "sudo dd *of=/dev/vd*"
      - "sudo dd *of=/dev/xvd*"
      - "sudo dd *of=/dev/nvme*"
      - "sudo dd *of=/dev/mmcblk*"
      - "sudo dd *of=/dev/mapper/*"
      - "sudo */dd *of=/dev/disk*"
      - "sudo */dd *of=/dev/rdisk*"
      - "sudo */dd *of=/dev/sd*"
      - "sudo */dd *of=/dev/hd*"
      - "sudo */dd *of=/dev/vd*"
      - "sudo */dd *of=/dev/xvd*"
      - "sudo */dd *of=/dev/nvme*"
      - "sudo */dd *of=/dev/mmcblk*"
      - "sudo */dd *of=/dev/mapper/*"
