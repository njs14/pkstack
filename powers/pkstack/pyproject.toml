[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "pkstack"
version = "0.6.0"
description = "PKStack Kiro-native verified development Power and project control CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "PKStack contributors" }]
dependencies = [
  "cyclopts==4.25.2",
  "PyYAML>=6.0.2,<7",
  "markdown-it-py>=4,<5",
  "agent-client-protocol==0.12.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pkstack"]
