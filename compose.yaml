name: pk-stack-lab

services:
  floci:
    image: floci/floci:2.0.1@sha256:4e451c39c7bb88e3cd4f87e8fc0c25d5b47695a51185d521e2241fa00486e8eb
    container_name: pk-stack-lab-floci
    user: root
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_DOCKER_NETWORK: pk-stack-lab-net
      FLOCI_STORAGE_MODE: memory
    volumes:
      - type: bind
        source: ${PK_STACK_LAB_DOCKER_SOCKET:?labctl doctor must discover the Docker socket first}
        target: /var/run/docker.sock
      - type: bind
        source: ${PK_STACK_LAB_FLOCI_DATA:?labctl up must prepare repository-local Floci data}
        target: /app/data
    networks:
      pk-stack-lab-net:
        aliases: [floci]
    labels:
      pk-stack-lab.managed: "true"
      pk-stack-lab.component: floci
      pk-stack-lab.version: "2.0.1"
      pk-stack-lab.source: compose

networks:
  pk-stack-lab-net:
    name: pk-stack-lab-net
    labels:
      pk-stack-lab.managed: "true"
      pk-stack-lab.component: network
      pk-stack-lab.source: compose
